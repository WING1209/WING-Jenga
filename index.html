<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOSHIO JENGGA</title>
    <!-- Three.js & Cannon.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #4a90e2, #87ceeb);
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }

        /* タイトル画面 */
        #title-screen {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        .game-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .blink-start {
            font-size: 1.5rem;
            padding: 15px 40px;
            background: #ffcc00;
            color: #333;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,204,0,0.4);
            animation: blink 1s infinite alternate;
            cursor: pointer;
        }
        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* メニュー画面 */
        #menu-screen {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }
        .menu-btn {
            width: 240px;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        /* ゲーム画面 */
        #game-screen {
            display: block;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 左右回転矢印 */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        #arrow-left { left: 15px; }
        #arrow-right { right: 15px; }

        /* 左側GUIパネル */
        #gui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 5;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 150px;
        }
        .gui-row {
            margin-bottom: 8px;
        }
        .gui-btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .gui-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #punch-btn {
            background: #e91e63;
            display: none;
        }
        #punch-btn.active {
            display: block;
            animation: pulse-punch 0.8s infinite alternate;
        }
        @keyframes pulse-punch {
            0% { transform: scale(1); box-shadow: 0 0 5px #ff4081; }
            100% { transform: scale(1.05); box-shadow: 0 0 15px #ff4081; }
        }

        /* 確認ポップアップ */
        #confirm-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .popup-box p {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .popup-btns {
            display: flex;
            justify-content: space-around;
        }
        .pop-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        #pop-ok { background: #4caf50; color: white; }
        #pop-no { background: #f44336; color: white; }

        /* 威力ゲージオーバーレイ */
        #gauge-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            color: white;
        }
        .gauge-bar-container {
            width: 80%;
            max-width: 350px;
            height: 40px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }
        .gauge-cursor {
            width: 30px;
            height: 34px;
            background: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .gauge-stop-btn {
            padding: 15px 40px;
            background: #ff9800;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        /* メッセージバナー */
        #message-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            z-index: 30;
            pointer-events: none;
            transition: 0.3s;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen">
        <div class="game-title">YOSHIO JENGGA</div>
        <button class="blink-start" id="start-trigger">スタート</button>
    </div>

    <!-- 2. メニュー画面 -->
    <div id="menu-screen" class="screen hidden">
        <div class="game-title" style="font-size: 2rem; margin-bottom: 30px;">MENU</div>
        <button class="menu-btn" id="btn-solo">ひとりで遊ぶ</button>
        <button class="menu-btn" id="btn-host">ホスト (準備中)</button>
        <button class="menu-btn" id="btn-guest">ゲスト (準備中)</button>
        <button class="menu-btn" id="btn-exit" style="background:#ffdddd; color:#d9534f;">終了</button>
    </div>

    <!-- 3. ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div id="canvas-container"></div>

        <div class="arrow-btn" id="arrow-left">◀</div>
        <div class="arrow-btn" id="arrow-right">▶</div>

        <div id="gui-panel">
            <div class="gui-row">P: <span id="player-name">YOSHIO</span></div>
            <div class="gui-row">獲得: <span id="score-count">0</span> 本</div>
            <div class="gui-row">パス残: <span id="pass-count">2</span> 回</div>
            <button class="gui-btn" id="pass-btn">パスする</button>
            <button class="gui-btn" id="zoom-btn">拡大表示</button>
            <button class="gui-btn" id="punch-btn">打ち抜く！</button>
        </div>

        <div id="message-banner"></div>
    </div>

    <!-- 確認ポップアップ -->
    <div id="confirm-popup" class="hidden">
        <div class="popup-box">
            <p>この棒でよいですか？</p>
            <div class="popup-btns">
                <button class="pop-btn" id="pop-no">NO</button>
                <button class="pop-btn" id="pop-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- 威力ゲージ -->
    <div id="gauge-overlay">
        <h2 style="margin:0; text-shadow:0 2px 5px rgba(0,0,0,0.5);">威力ゲージ</h2>
        <div class="gauge-bar-container" id="gauge-container">
            <div class="gauge-cursor" id="gauge-cursor"></div>
        </div>
        <button class="gauge-stop-btn" id="gauge-stop-btn">ストップ！</button>
    </div>

    <script>
        // --- 状態管理 ---
        let gameState = 'title'; // 'view', 'action', 'check', 'place', 'gameover'
        let isZoomed = false;
        let selectedBlock = null;
        let extractedBlockData = null;
        let passRemaining = 2;
        let score = 0;
        let timerSeconds = 0;
        let timerInterval = null;

        // --- DOM要素 ---
        const titleScreen = document.getElementById('title-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const confirmPopup = document.getElementById('confirm-popup');
        const gaugeOverlay = document.getElementById('gauge-overlay');
        const messageBanner = document.getElementById('message-banner');

        document.getElementById('start-trigger').addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        document.getElementById('btn-solo').addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            initGame3D();
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            window.close();
            alert('ブラウザのタブを閉じてください。');
        });

        // --- Three.js & Cannon.js ---
        let scene, camera, renderer, world;
        let blocks = [];
        let towerGroup;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // カメラパラメータ（平行表示・支点連動）
        let cameraAngle = 0;
        let lookAtY = 6;      // 注視点のY（支点）
        let cameraHeightOffset = 8; // 注視点からの高さオフセット
        let cameraRadius = 16;
        let isDragging = false;
        let previousTouchY = 0;

        function initGame3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 物理ワールド（初期は重力を弱くせず通常設定だが、全静止状態）
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            // ライティング
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 台座
            const baseGeo = new THREE.BoxGeometry(6, 1, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.5;
            scene.add(baseMesh);

            const baseShape = new CANNON.Box(new CANNON.Vec3(3, 0.5, 3));
            const baseBody = new CANNON.Body({ mass: 0 });
            baseBody.addShape(baseShape);
            baseBody.position.set(0, -0.5, 0);
            world.addBody(baseBody);

            // 20段 × 3本 = 60本
            towerGroup = new THREE.Group();
            scene.add(towerGroup);

            const blockWidth = 1.2;
            const blockHeight = 0.6;
            const blockDepth = 3.6;
            const blockShape = new CANNON.Box(new CANNON.Vec3(blockWidth/2, blockHeight/2, blockDepth/2));

            for (let i = 0; i < 20; i++) {
                let y = blockHeight/2 + i * blockHeight;
                let isEven = (i % 2 === 0);

                for (let j = 0; j < 3; j++) {
                    let x = 0, z = 0, rotY = 0;
                    if (isEven) {
                        x = (j - 1) * 1.25;
                        rotY = 0;
                    } else {
                        z = (j - 1) * 1.25;
                        rotY = Math.PI / 2;
                    }

                    const geo = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.4 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData = { id: blocks.length, originalColor: 0xDEB887, floor: i };
                    towerGroup.add(mesh);

                    // 【重要】視点操作時は物理演算を完全に効かせないため、最初は mass = 0 (Static)
                    const body = new CANNON.Body({ mass: 0 });
                    body.addShape(blockShape);
                    body.position.set(x, y, z);
                    body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
                    world.addBody(body);

                    blocks.push({ mesh, body, initialPos: new CANNON.Vec3(x, y, z), isDynamic: false });
                }
            }

            gameState = 'view';
            initEvents();
            animate();
        }

        // カメラ位置更新（支点連動・拡大は5段分サイズ）
        function updateCameraPosition() {
            let targetRadius = isZoomed ? 6 : 18;
            if (isZoomed) {
                // 5段分（高さ約3.0）がおさまる拡大サイズ
                cameraHeightOffset = 3.0;
            } else {
                cameraHeightOffset = 8.0;
            }

            const rad = cameraAngle * Math.PI / 180;
            camera.position.x = Math.sin(rad) * targetRadius;
            camera.position.z = Math.cos(rad) * targetRadius;
            camera.position.y = lookAtY + cameraHeightOffset;
            camera.lookAt(0, lookAtY, 0);
        }

        // --- イベント管理 ---
        function initEvents() {
            document.getElementById('arrow-left').addEventListener('click', () => {
                cameraAngle -= 45;
                updateCameraPosition();
            });
            document.getElementById('arrow-right').addEventListener('click', () => {
                cameraAngle += 45;
                updateCameraPosition();
            });

            // 上下スライド（支点ごと上下に動く）
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && gameState === 'view') {
                    isDragging = true;
                    previousTouchY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || gameState !== 'view') return;
                const currentY = e.touches[0].clientY;
                const deltaY = currentY - previousTouchY;
                previousTouchY = currentY;

                // 支点(lookAtY)を上下に動かし、カメラも一緒に平行移動
                lookAtY -= deltaY * 0.05;
                lookAtY = Math.max(3, Math.min(15, lookAtY));
                updateCameraPosition();
            });

            window.addEventListener('touchend', () => { isDragging = false; });

            // タップ選択
            window.addEventListener('click', (e) => {
                if (e.target.closest('#gui-panel') || e.target.closest('#confirm-popup') || e.target.closest('#gauge-overlay') || e.target.closest('.arrow-btn')) return;

                if (gameState === 'view') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

                    if (intersects.length > 0) {
                        const hitMesh = intersects[0].object;
                        selectBlockForConfirmation(hitMesh);
                    }
                } else if (gameState === 'place') {
                    // 上から見た配置微調整（ツンツンして置く位置を決定）
                    placeExtractedBlock();
                }
            });

            document.getElementById('zoom-btn').addEventListener('click', () => {
                isZoomed = !isZoomed;
                document.getElementById('zoom-btn').textContent = isZoomed ? '縮小表示' : '拡大表示';
                updateCameraPosition();
            });

            document.getElementById('pass-btn').addEventListener('click', () => {
                if (passRemaining > 0 && gameState === 'view') {
                    passRemaining--;
                    document.getElementById('pass-count').textContent = passRemaining;
                    showBanner('パスしました！次のプレイヤーへ');
                } else {
                    alert('パスできない状態か、回数が残っていません！');
                }
            });

            document.getElementById('pop-no').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                if (selectedBlock) {
                    selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
                    selectedBlock = null;
                }
            });

            document.getElementById('pop-ok').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                startActionPhase();
            });

            document.getElementById('punch-btn').addEventListener('click', () => {
                if (gameState === 'action') openGauge();
            });

            document.getElementById('gauge-stop-btn').addEventListener('click', () => {
                stopGauge();
            });
        }

        function selectBlockForConfirmation(mesh) {
            if (selectedBlock) {
                selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
            }
            selectedBlock = mesh;
            selectedBlock.material.color.setHex(0xff0000); // 赤く表示
            confirmPopup.classList.remove('hidden');
        }

        // --- アクションフェーズ開始（物理演算有効化） ---
        function startActionPhase() {
            gameState = 'action';
            isZoomed = true; // 5段分の拡大表示
            document.getElementById('zoom-btn').textContent = '縮小表示';
            
            // 支点を選択されたブロックの高さに合わせる
            lookAtY = selectedBlock.position.y;
            updateCameraPosition();

            // すべてのブロックに重み（mass = 1.0）を与え、物理演算を有効化開始！
            blocks.forEach(b => {
                b.body.mass = 1.0;
                b.body.updateMassProperties();
                b.isDynamic = true;
            });

            document.getElementById('punch-btn').classList.add('active');
            showBanner('アクションモード開始！棒を押し出すか打ち抜け！');
        }

        // 威力ゲージ
        let isAnimatingGauge = false;
        let gaugePos = 0;
        let gaugeDir = 1;

        function openGauge() {
            isAnimatingGauge = true;
            gaugePos = 0;
            gaugeDir = 1;
            gaugeOverlay.style.display = 'flex';
            requestAnimationFrame(updateGaugeAnimation);
        }

        function updateGaugeAnimation() {
            if (!isAnimatingGauge) return;
            gaugePos += gaugeDir * 4;
            if (gaugePos >= 90 || gaugePos <= 0) gaugeDir *= -1;
            document.getElementById('gauge-cursor').style.left = gaugePos + '%';
            requestAnimationFrame(updateGaugeAnimation);
        }

        function stopGauge() {
            isAnimatingGauge = false;
            gaugeOverlay.style.display = 'none';

            let power = Math.floor(Math.abs(gaugePos - 45) * 2 + 10);
            showBanner(`威力: ${power}！ 打ち抜き発動！`);

            // 選択棒を弾き飛ばす
            const target = blocks.find(b => b.mesh === selectedBlock);
            if (target) {
                target.body.velocity.set(0, 3, 12);
                target.body.angularVelocity.set(4, 4, 0);
                extractedBlockData = target;
            }

            // 3秒間の成功判定タイマー開始
            startSuccessCheckTimer();
        }

        // --- 3秒間ジェンガが倒れないか判定するタイマー ---
        function startSuccessCheckTimer() {
            gameState = 'check';
            document.getElementById('punch-btn').classList.remove('active');
            timerSeconds = 3;
            showBanner('バランス確認中... (3秒)');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds > 0) {
                    showBanner(`バランス確認中... (${timerSeconds}秒)`);
                } else {
                    clearInterval(timerInterval);
                    checkTowerStability();
                }
            }, 1000);
        }

        // タワーが崩れていないか判定
        function checkTowerStability() {
            // 簡易崩壊判定：いずれかのブロックが大きく落ちていないか・傾いていないか
            let isCollapsed = false;
            blocks.forEach(b => {
                if (b !== extractedBlockData && (b.body.position.y < -0.2 || Math.abs(b.body.position.x) > 4 || Math.abs(b.body.position.z) > 4)) {
                    isCollapsed = true;
                }
            });

            if (isCollapsed) {
                gameState = 'gameover';
                showBanner('GAME OVER: タワーが崩れました！');
            } else {
                // 3秒経過成功！物理演算を停止して固定
                freezeTower();
                score++;
                document.getElementById('score-count').textContent = score;
                showBanner('抜き取り成功！ 上部に配置してください');
                
                // 配置フェーズへ
                startPlacementPhase();
            }
        }

        // 物理演算停止＆強制固定
        function freezeTower() {
            blocks.forEach(b => {
                b.body.mass = 0;
                b.body.velocity.set(0,0,0);
                b.body.angularVelocity.set(0,0,0);
                b.body.updateMassProperties();
                b.isDynamic = false;
            });
        }

        // --- 配置（積み上げ）フェーズ ---
        function startPlacementPhase() {
            gameState = 'place';
            // 上から見た画面にカメラを移動
            lookAtY = 15;
            cameraAngle = 0;
            isZoomed = false;
            updateCameraPosition();

            if (extractedBlockData) {
                extractedBlockData.mesh.material.transparent = true;
                extractedBlockData.mesh.material.opacity = 0.6; // 半透明表示
            }
        }

        function placeExtractedBlock() {
            if (!extractedBlockData) return;

            showBanner('配置位置決定！安定確認中...(3秒)');
            
            // 塔の最上部に移動させる
            let topY = 20 * 0.6 + 0.6;
            extractedBlockData.body.position.set(0, topY, 0);
            extractedBlockData.mesh.material.transparent = false;
            extractedBlockData.mesh.material.opacity = 1.0;
            extractedBlockData.mesh.material.color.setHex(extractedBlockData.mesh.userData.originalColor);

            // 再度物理演算をオンにして3秒確認
            blocks.forEach(b => {
                b.body.mass = 1.0;
                b.body.updateMassProperties();
                b.isDynamic = true;
            });

            extractedBlockData = null;
            startSuccessCheckTimerForPlacement();
        }

        function startSuccessCheckTimerForPlacement() {
            gameState = 'check';
            timerSeconds = 3;
            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds > 0) {
                    showBanner(`設置安定確認中... (${timerSeconds}秒)`);
                } else {
                    clearInterval(timerInterval);
                    checkPlacementStability();
                }
            }, 1000);
        }

        function checkPlacementStability() {
            let isCollapsed = false;
            blocks.forEach(b => {
                if (b.body.position.y < -0.2 || Math.abs(b.body.position.x) > 4 || Math.abs(b.body.position.z) > 4) {
                    isCollapsed = true;
                }
            });

            if (isCollapsed) {
                gameState = 'gameover';
                showBanner('GAME OVER: 設置後に崩壊しました！');
            } else {
                freezeTower();
                showBanner('ターンクリア！次のプレイヤーへ');
                selectedBlock = null;
                setTimeout(() => {
                    gameState = 'view';
                    lookAtY = 6;
                    updateCameraPosition();
                    showBanner('');
                }, 2000);
            }
        }

        // --- メインループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (world) {
                // アクション中または確認中のみワールドステップを回す（視点操作時は完全に固定）
                if (gameState === 'action' || gameState === 'check') {
                    world.step(1 / 60, delta, 3);
                    for (let i = 0; i < blocks.length; i++) {
                        blocks[i].mesh.position.copy(blocks[i].body.position);
                        blocks[i].mesh.quaternion.copy(blocks[i].body.quaternion);
                    }
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function showBanner(text) {
            messageBanner.textContent = text;
            messageBanner.style.opacity = '1';
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
