<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>オンラインババ抜き - スマホ版</title>
  <style>
    :root {
      --bg-color: #1b4d3e;
      --card-width: 48px;
      --card-height: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* 上部・左右：対戦相手エリア */
    .opponents-container {
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
      background: rgba(0, 0, 0, 0.2);
    }

    .player-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      width: 30%;
    }

    .player-node.active {
      color: #ffd700;
      font-weight: bold;
    }

    .opponent-cards {
      display: flex;
      margin-top: 4px;
    }

    /* ミニカード（相手の手札） */
    .card-mini {
      width: 14px;
      height: 22px;
      background: #2a52be;
      border: 1px solid #fff;
      border-radius: 2px;
      margin-left: -6px;
    }
    .card-mini:first-child { margin-left: 0; }

    /* 中央：フィールド・情報通知エリア */
    .field-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      text-align: center;
    }

    .status-msg {
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .action-btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      display: none; /* デフォルト非表示 */
    }

    /* 下部：自分のエリア */
    .my-area {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* アイテムスロット */
    .item-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .item-btn {
      background: #333;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .item-btn:disabled {
      opacity: 0.4;
      border-color: #666;
      color: #888;
    }

    /* 自分の手札 */
    .my-cards {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 10px 0;
      overflow-x: auto;
    }

    /* 通常カードのデザイン */
    .card {
      width: var(--card-width);
      height: var(--card-height);
      background: white;
      color: black;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      margin-left: -15px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:first-child { margin-left: 0; }

    .card.red { color: #d32f2f; }
    .card.joker { background: #ab47bc; color: white; }

    /* 揃ったカード（外枠点灯アニメーション） */
    .card.match {
      animation: pulse-glow 1s infinite alternate;
      z-index: 10;
      transform: translateY(-8px);
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
        border: 2px solid #00ffff;
      }
      100% {
        box-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff;
        border: 2px solid #ffffff;
      }
    }
  </style>
</head>
<body>

  <!-- 上部：対戦相手エリア -->
  <div class="opponents-container">
    <div class="player-node" id="p1">
      <span class="p-name">プレイヤー1</span>
      <div class="opponent-cards" id="p1-cards"></div>
    </div>
    <div class="player-node" id="p2">
      <span class="p-name">プレイヤー2</span>
      <div class="opponent-cards" id="p2-cards"></div>
    </div>
    <div class="player-node" id="p3">
      <span class="p-name">プレイヤー3</span>
      <div class="opponent-cards" id="p3-cards"></div>
    </div>
  </div>

  <!-- 中央：メッセージ・アクションエリア -->
  <div class="field-area">
    <div class="status-msg" id="status-msg">ゲームを準備中...</div>
    <button class="action-btn" id="discard-btn" onclick="discardPairs()">ペアを捨てる</button>
  </div>

  <!-- 下部：自分の手札・アイテムエリア -->
  <div class="my-area">
    <!-- アイテム欄 -->
    <div class="item-bar">
      <button class="item-btn" onclick="useItem('透視')">▣ 透視</button>
      <button class="item-btn" onclick="useItem('スキップ')">▣ スキップ</button>
      <button class="item-btn" onclick="useItem('順番反転')">▣ 反転</button>
      <button class="item-btn" onclick="useItem('ジョーカー')">▣ 🃏探知</button>
      <button class="item-btn" onclick="useItem('強奪')">▣ 強奪</button>
    </div>

    <!-- 自分の手札 -->
    <div class="my-cards" id="my-cards"></div>
  </div>

  <script>
    // サンプル用手札データ（数字とマーク）
    let myHand = [
      { id: 1, num: '7', suit: '♠', type: 'black' },
      { id: 2, num: '7', suit: '♥', type: 'red' }, // ペア
      { id: 3, num: 'K', suit: '♦', type: 'red' },
      { id: 4, num: 'A', suit: '♣', type: 'black' },
      { id: 5, num: 'A', suit: '♠', type: 'black' }, // ペア
      { id: 6, num: 'JOKER', suit: '🃏', type: 'joker' }
    ];

    // 画面初期化
    function init() {
      renderMyHand();
      renderOpponents();
      checkPairs();
    }

    // 自分の手札を描画
    function renderMyHand() {
      const container = document.getElementById('my-cards');
      container.innerHTML = '';

      myHand.forEach(card => {
        const el = document.createElement('div');
        el.className = `card ${card.type} ${card.isMatch ? 'match' : ''}`;
        el.innerText = card.num === 'JOKER' ? '🃏' : `${card.suit}${card.num}`;
        container.appendChild(el);
      });
    }

    // 対戦相手の手札枚数を描画（ダミー表示）
    function renderOpponents() {
      ['p1-cards', 'p2-cards', 'p3-cards'].forEach(id => {
        const container = document.getElementById(id);
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) { // 4枚所持と仮定
          const miniCard = document.createElement('div');
          miniCard.className = 'card-mini';
          container.appendChild(miniCard);
        }
      });
    }

    // 揃っているペアの検知と点灯フラグ処理
    function checkPairs() {
      const counts = {};
      
      // 数字の出現回数をカウント（JOKER以外）
      myHand.forEach(card => {
        if (card.num !== 'JOKER') {
          counts[card.num] = (counts[card.num] || 0) + 1;
        }
      });

      let hasMatch = false;
      myHand.forEach(card => {
        if (counts[card.num] >= 2) {
          card.isMatch = true;
          hasMatch = true;
        } else {
          card.isMatch = false;
        }
      });

      renderMyHand();

      // ペアが存在する場合は「捨てる」ボタンを表示
      const btn = document.getElementById('discard-btn');
      const msg = document.getElementById('status-msg');
      if (hasMatch) {
        btn.style.display = 'block';
        msg.innerText = '揃ったカードが光っています！';
      } else {
        btn.style.display = 'none';
        msg.innerText = 'あなたのターンです。カードを引いてください。';
      }
    }

    // 点灯しているペアを一括で捨てるアクション
    function discardPairs() {
      myHand = myHand.filter(card => !card.isMatch);
      checkPairs();
      document.getElementById('status-msg').innerText = 'カードを捨てました！';
    }

    // アイテム使用のテスト用処理
    function useItem(itemName) {
      alert(`【アイテム使用】${itemName} を発動しました！`);
      if (itemName === 'ジョーカー') {
        alert('探知結果：ジョーカーは「あなた」が持っています！');
      }
    }

    // 起動
    init();
  </script>
</body>
</html>
