<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>オンラインババ抜き - スマホ版</title>
  <style>
    :root {
      --bg-color: #1b4d3e;
      --card-width: 50px;
      --card-height: 75px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================
       タイトル画面のスタイル
    ========================================== */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #2d7059 0%, #0d2b22 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    .title-logo {
      font-size: 32px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      margin-bottom: 10px;
      text-align: center;
    }

    .title-sub {
      font-size: 14px;
      color: #e0e0e0;
      margin-bottom: 50px;
    }

    .start-msg {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      animation: blink 1.2s infinite;
      letter-spacing: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* ==========================================
       メインゲーム画面のスタイル
    ========================================== */
    #game-screen {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
    }

    /* 上部：対戦相手エリア */
    .opponents-container {
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
      background: rgba(0, 0, 0, 0.3);
    }

    .player-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      width: 30%;
    }

    .opponent-cards {
      display: flex;
      margin-top: 6px;
    }

    .card-mini {
      width: 16px;
      height: 24px;
      background: #2a52be;
      border: 1px solid #fff;
      border-radius: 3px;
      margin-left: -8px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }
    .card-mini:first-child { margin-left: 0; }

    /* 中央：フィールド・メッセージエリア */
    .field-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .status-msg {
      font-size: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .action-btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      display: none;
    }

    /* 下部：自分のエリア */
    .my-area {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* アイテム欄 */
    .item-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .item-btn {
      background: #222;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 自分の手札コンテナ */
    .my-cards {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 85px;
      padding: 5px 0;
    }

    /* カードデザイン修正版 */
    .card {
      width: var(--card-width);
      height: var(--card-height);
      background: white;
      color: #111;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      margin-left: -12px; /* 重なり具合を最適化 */
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }
    .card:first-child { margin-left: 0; }

    .card.red { color: #d32f2f; }
    .card.joker { 
      background: #8e24aa; 
      color: white; 
      border-color: #ba68c8;
    }

    /* 揃ったカード（外枠点灯アニメーション） */
    .card.match {
      animation: pulse-glow 1s infinite alternate;
      z-index: 10;
      transform: translateY(-10px);
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 8px #00ffff, 0 0 12px #00ffff;
        border: 2px solid #00ffff;
      }
      100% {
        box-shadow: 0 0 18px #00ffff, 0 0 28px #00ffff;
        border: 2px solid #ffffff;
      }
    }
  </style>
</head>
<body>

  <!-- ① タイトル画面 -->
  <div id="title-screen" onclick="startGame()">
    <div class="title-logo">ババ抜き Online<br>アイテムバトル</div>
    <div class="title-sub">スマホ専用特殊ルールババ抜き</div>
    <div class="start-msg">- TAP TO START -</div>
  </div>

  <!-- ② ゲームメイン画面 -->
  <div id="game-screen">
    <!-- 上部：対戦相手エリア -->
    <div class="opponents-container">
      <div class="player-node">
        <span class="p-name">プレイヤー1</span>
        <div class="opponent-cards" id="p1-cards"></div>
      </div>
      <div class="player-node">
        <span class="p-name">プレイヤー2</span>
        <div class="opponent-cards" id="p2-cards"></div>
      </div>
      <div class="player-node">
        <span class="p-name">プレイヤー3</span>
        <div class="opponent-cards" id="p3-cards"></div>
      </div>
    </div>

    <!-- 中央：メッセージ・アクションエリア -->
    <div class="field-area">
      <div class="status-msg" id="status-msg">あなたのターンです</div>
      <button class="action-btn" id="discard-btn" onclick="discardPairs()">ペアを捨てる</button>
    </div>

    <!-- 下部：自分のエリア -->
    <div class="my-area">
      <!-- アイテム欄 -->
      <div class="item-bar">
        <button class="item-btn" onclick="useItem('透視')">▣ 透視</button>
        <button class="item-btn" onclick="useItem('スキップ')">▣ スキップ</button>
        <button class="item-btn" onclick="useItem('順番反転')">▣ 反転</button>
        <button class="item-btn" onclick="useItem('ジョーカー')">▣ 探知</button>
        <button class="item-btn" onclick="useItem('強奪')">▣ 強奪</button>
      </div>

      <!-- 自分の手札 -->
      <div class="my-cards" id="my-cards"></div>
    </div>
  </div>

  <script>
    // 手札データ
    let myHand = [
      { id: 1, num: '7', suit: '♠', type: 'black' },
      { id: 2, num: '7', suit: '♥', type: 'red' },   // ペア（点灯対象）
      { id: 3, num: 'K', suit: '♦', type: 'red' },
      { id: 4, num: 'A', suit: '♣', type: 'black' },
      { id: 5, num: 'A', suit: '♠', type: 'black' }, // ペア（点灯対象）
      { id: 6, num: 'JK', suit: '🃏', type: 'joker' }
    ];

    // ゲーム開始処理（タイトルタップ時）
    function startGame() {
      const titleScreen = document.getElementById('title-screen');
      titleScreen.style.display = 'none'; // タイトルを隠す
      
      initGame(); // ゲーム画面の描画
    }

    // ゲーム初期化
    function initGame() {
      renderOpponents();
      checkPairs();
    }

    // 自分の手札を描画
    function renderMyHand() {
      const container = document.getElementById('my-cards');
      container.innerHTML = '';

      myHand.forEach(card => {
        const el = document.createElement('div');
        el.className = `card ${card.type} ${card.isMatch ? 'match' : ''}`;
        
        if (card.type === 'joker') {
          el.innerHTML = `<span>🃏</span><span>JK</span>`;
        } else {
          el.innerHTML = `<span>${card.suit}</span><span>${card.num}</span>`;
        }
        
        container.appendChild(el);
      });
    }

    // 対戦相手の手札を描画（ダミー）
    function renderOpponents() {
      ['p1-cards', 'p2-cards', 'p3-cards'].forEach(id => {
        const container = document.getElementById(id);
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
          const miniCard = document.createElement('div');
          miniCard.className = 'card-mini';
          container.appendChild(miniCard);
        }
      });
    }

    // 揃っているペアの検知と点灯フラグ処理
    function checkPairs() {
      const counts = {};
      
      myHand.forEach(card => {
        if (card.type !== 'joker') {
          counts[card.num] = (counts[card.num] || 0) + 1;
        }
      });

      let hasMatch = false;
      myHand.forEach(card => {
        if (counts[card.num] >= 2) {
          card.isMatch = true;
          hasMatch = true;
        } else {
          card.isMatch = false;
        }
      });

      renderMyHand();

      const btn = document.getElementById('discard-btn');
      const msg = document.getElementById('status-msg');
      
      if (hasMatch) {
        btn.style.display = 'block';
        msg.innerText = '揃ったカードが光っています！';
      } else {
        btn.style.display = 'none';
        msg.innerText = 'あなたのターンです。カードを引いてください。';
      }
    }

    // 点灯ペアを捨てる
    function discardPairs() {
      myHand = myHand.filter(card => !card.isMatch);
      checkPairs();
      document.getElementById('status-msg').innerText = 'カードを捨てました！';
    }

    // アイテム使用テスト
    function useItem(itemName) {
      alert(`【アイテム発動】${itemName}`);
      if (itemName === 'ジョーカー') {
        alert('探知結果：あなたがジョーカーを持っています！');
      }
    }
  </script>
</body>
</html>
