<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOSHIO JENGGA</title>
    <!-- Three.js & Cannon.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #4a90e2, #87ceeb);
        }
        
        /* 共通画面スタイル */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }

        /* タイトル画面 */
        #title-screen {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        .game-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .blink-start {
            font-size: 1.5rem;
            padding: 15px 40px;
            background: #ffcc00;
            color: #333;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,204,0,0.4);
            animation: blink 1s infinite alternate;
            cursor: pointer;
        }
        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* メニュー画面 */
        #menu-screen {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }
        .menu-btn {
            width: 240px;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #eee;
        }

        /* ゲーム画面 */
        #game-screen {
            display: block;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 左右回転矢印 */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        #arrow-left { left: 15px; }
        #arrow-right { right: 15px; }

        /* 左側GUIパネル */
        #gui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 5;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 150px;
        }
        .gui-row {
            margin-bottom: 8px;
        }
        .gui-btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .gui-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #punch-btn {
            background: #e91e63;
            display: none; /* アクション中のみ表示・点灯 */
        }
        #punch-btn.active {
            display: block;
            animation: pulse-punch 0.8s infinite alternate;
        }
        @keyframes pulse-punch {
            0% { transform: scale(1); box-shadow: 0 0 5px #ff4081; }
            100% { transform: scale(1.05); box-shadow: 0 0 15px #ff4081; }
        }

        /* 確認ポップアップ */
        #confirm-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .popup-box p {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .popup-btns {
            display: flex;
            justify-content: space-around;
        }
        .pop-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        #pop-ok { background: #4caf50; color: white; }
        #pop-no { background: #f44336; color: white; }

        /* 威力ゲージオーバーレイ */
        #gauge-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            color: white;
        }
        .gauge-bar-container {
            width: 80%;
            max-width: 350px;
            height: 40px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }
        .gauge-cursor {
            width: 30px;
            height: 34px;
            background: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 10px #ffeb3b;
        }
        .gauge-stop-btn {
            padding: 15px 40px;
            background: #ff9800;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,152,0,0.5);
        }

        /* 演出テキスト・メッセージ */
        #message-banner {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            z-index: 30;
            pointer-events: none;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen">
        <div class="game-title">YOSHIO JENGGA</div>
        <button class="blink-start" id="start-trigger">スタート</button>
    </div>

    <!-- 2. メニュー画面 -->
    <div id="menu-screen" class="screen hidden">
        <div class="game-title" style="font-size: 2rem; margin-bottom: 30px;">MENU</div>
        <button class="menu-btn" id="btn-solo">ひとりで遊ぶ</button>
        <button class="menu-btn" id="btn-host">ホスト (準備中)</button>
        <button class="menu-btn" id="btn-guest">ゲスト (準備中)</button>
        <button class="menu-btn" id="btn-exit" style="background:#ffdddd; color:#d9534f;">終了</button>
    </div>

    <!-- 3. ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div id="canvas-container"></div>

        <!-- 左右回転矢印 -->
        <div class="arrow-btn" id="arrow-left">◀</div>
        <div class="arrow-btn" id="arrow-right">▶</div>

        <!-- 左側GUI -->
        <div id="gui-panel">
            <div class="gui-row">P: <span id="player-name">YOSHIO</span></div>
            <div class="gui-row">獲得: <span id="score-count">0</span> 本</div>
            <div class="gui-row">パス残: <span id="pass-count">2</span> 回</div>
            <button class="gui-btn" id="pass-btn">パスする</button>
            <button class="gui-btn" id="zoom-btn">拡大表示</button>
            <button class="gui-btn" id="punch-btn">打ち抜く！</button>
        </div>

        <!-- 成功・演出メッセージ -->
        <div id="message-banner"></div>
    </div>

    <!-- 確認ポップアップ -->
    <div id="confirm-popup" class="hidden">
        <div class="popup-box">
            <p>この棒でよいですか？</p>
            <div class="popup-btns">
                <button class="pop-btn" id="pop-no">NO</button>
                <button class="pop-btn" id="pop-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- 威力ゲージオーバーレイ -->
    <div id="gauge-overlay">
        <h2 style="margin:0; text-shadow:0 2px 5px rgba(0,0,0,0.5);">威力ゲージ</h2>
        <div class="gauge-bar-container" id="gauge-container">
            <div class="gauge-cursor" id="gauge-cursor"></div>
        </div>
        <button class="gauge-stop-btn" id="gauge-stop-btn">ストップ！</button>
    </div>

    <script>
        // --- アプリケーション状態管理 ---
        let currentScreen = 'title';
        let isZoomed = false;
        let isActionActive = false;
        let selectedBlock = null;
        let passRemaining = 2;
        let score = 0;
        let isAnimatingGauge = false;
        let gaugePos = 0;
        let gaugeDir = 1;

        // --- DOM要素 ---
        const titleScreen = document.getElementById('title-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const confirmPopup = document.getElementById('confirm-popup');
        const gaugeOverlay = document.getElementById('gauge-overlay');
        const messageBanner = document.getElementById('message-banner');
        
        // 画面遷移イベント
        document.getElementById('start-trigger').addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        document.getElementById('btn-solo').addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            initGame3D();
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            window.close();
            alert('ブラウザのタブを閉じてください。');
        });

        // --- Three.js & Cannon.js 初期化 ---
        let scene, camera, renderer, world;
        let blocks = [];
        let towerGroup;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // カメラ・視点コントロール用変数
        let cameraAngle = 0;
        let cameraHeight = 10;
        let cameraRadius = 18;
        let isDragging = false;
        let previousTouchY = 0;

        function initGame3D() {
            const container = document.getElementById('canvas-container');

            // シーン・カメラ・レンダラー
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 物理ワールド
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            // ライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 台座 (Base)
            const baseGeo = new THREE.BoxGeometry(6, 1, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.5;
            scene.add(baseMesh);

            const baseShape = new CANNON.Box(new CANNON.Vec3(3, 0.5, 3));
            const baseBody = new CANNON.Body({ mass: 0 });
            baseBody.addShape(baseShape);
            baseBody.position.set(0, -0.5, 0);
            world.addBody(baseBody);

            // ジェンガブロック生成 (20段 × 3本 = 60本)
            towerGroup = new THREE.Group();
            scene.add(towerGroup);

            const blockWidth = 1.2;
            const blockHeight = 0.6;
            const blockDepth = 3.6;
            const massPerBlock = 1.0;

            const blockShape = new CANNON.Box(new CANNON.Vec3(blockWidth/2, blockHeight/2, blockDepth/2));

            for (let i = 0; i < 20; i++) {
                let y = blockHeight/2 + i * blockHeight;
                let isEven = (i % 2 === 0);

                for (let j = 0; j < 3; j++) {
                    let x = 0, z = 0;
                    let rotY = 0;

                    if (isEven) {
                        // 横向き (X軸方向)
                        x = (j - 1) * 1.25;
                        rotY = 0;
                    } else {
                        // 縦向き (Z軸方向)
                        z = (j - 1) * 1.25;
                        rotY = Math.PI / 2;
                    }

                    // Three.js メッシュ
                    const geo = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.4 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    // ユーザーデータとして管理用情報を持たせる
                    mesh.userData = { id: blocks.length, originalColor: 0xDEB887, isSelected: false };
                    towerGroup.add(mesh);

                    // Cannon.js ボディ
                    const body = new CANNON.Body({ mass: massPerBlock });
                    body.addShape(blockShape);
                    
                    // 回転を考慮した初期位置・姿勢
                    body.position.set(x, y, z);
                    body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
                    world.addBody(body);

                    blocks.push({ mesh, body });
                }
            }

            // イベント登録
            initEvents();

            // ループ開始
            animate();
        }

        // カメラ位置計算
        function updateCameraPosition() {
            let targetY = isZoomed ? 3 : cameraHeight;
            let targetRadius = isZoomed ? 6 : cameraRadius;
            
            const rad = cameraAngle * Math.PI / 180;
            camera.position.x = Math.sin(rad) * targetRadius;
            camera.position.z = Math.cos(rad) * targetRadius;
            camera.position.y = targetY;
            camera.lookAt(0, isZoomed ? 3 : 6, 0);
        }

        // --- 操作・イベントハンドリング ---
        function initEvents() {
            // 左右回転ボタン
            document.getElementById('arrow-left').addEventListener('click', () => {
                cameraAngle -= 45;
                updateCameraPosition();
            });
            document.getElementById('arrow-right').addEventListener('click', () => {
                cameraAngle += 45;
                updateCameraPosition();
            });

            // 上下スライド（通常時のみ画面移動）
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousTouchY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                // アクションモード中は上下スライド禁止
                if (isActionActive) return; 

                const currentY = e.touches[0].clientY;
                const deltaY = currentY - previousTouchY;
                previousTouchY = currentY;

                if (!isZoomed) {
                    cameraHeight += deltaY * 0.05;
                    cameraHeight = Math.max(2, Math.min(25, cameraHeight));
                    updateCameraPosition();
                }
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // ブロックタップ（Raycaster判定）
            window.addEventListener('click', (e) => {
                // UI上のクリックはスルー
                if (e.target.closest('#gui-panel') || e.target.closest('#confirm-popup') || e.target.closest('#gauge-overlay') || e.target.closest('.arrow-btn')) {
                    return;
                }

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const meshes = blocks.map(b => b.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    handleBlockTap(hitMesh);
                }
            });

            // GUI: 拡大/縮小ボタン
            document.getElementById('zoom-btn').addEventListener('click', () => {
                isZoomed = !isZoomed;
                document.getElementById('zoom-btn').textContent = isZoomed ? '縮小表示' : '拡大表示';
                updateCameraPosition();
            });

            // パスボタン
            document.getElementById('pass-btn').addEventListener('click', () => {
                if (passRemaining > 0) {
                    passRemaining--;
                    document.getElementById('pass-count').textContent = passRemaining;
                    showBanner('パスしました！');
                } else {
                    alert('パス回数が残っていません！');
                }
            });

            // ポップアップボタン
            document.getElementById('pop-no').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                if (selectedBlock) {
                    selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
                    selectedBlock = null;
                }
            });

            document.getElementById('pop-ok').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                startActionModule();
            });

            // 打ち抜くボタン
            document.getElementById('punch-btn').addEventListener('click', () => {
                openGauge();
            });

            // ゲージストップボタン
            document.getElementById('gauge-stop-btn').addEventListener('click', () => {
                stopGauge();
            });
        }

        // ブロックタップ時の処理
        function handleBlockTap(mesh) {
            if (selectedBlock && selectedBlock !== mesh) {
                selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
            }
            selectedBlock = mesh;
            selectedBlock.material.color.setHex(0xff0000); // 赤く表示

            // 確認ポップアップ表示
            confirmPopup.classList.remove('hidden');
        }

        // アクションモードへ移行
        function startActionModule() {
            isActionActive = true;
            isZoomed = true; // 自動で拡大画面モード
            document.getElementById('zoom-btn').textContent = '縮小表示';
            updateCameraPosition();

            // 打ち抜くボタン点灯
            document.getElementById('punch-btn').classList.add('active');
            showBanner('【獲得アクション】棒を押し出すか打ち抜け！');
        }

        // 威力ゲージ起動
        function openGauge() {
            isAnimatingGauge = true;
            gaugePos = 0;
            gaugeDir = 1;
            gaugeOverlay.style.display = 'flex';
            requestAnimationFrame(updateGaugeAnimation);
        }

        function updateGaugeAnimation() {
            if (!isAnimatingGauge) return;
            gaugePos += gaugeDir * 3;
            if (gaugePos >= 90 || gaugePos <= 0) {
                gaugeDir *= -1;
            }
            document.getElementById('gauge-cursor').style.left = gaugePos + '%';
            requestAnimationFrame(updateGaugeAnimation);
        }

        // ゲージストップ＆打ち抜き演出
        function stopGauge() {
            isAnimatingGauge = false;
            gaugeOverlay.style.display = 'none';

            let powerScore = Math.floor(Math.abs(gaugePos - 45) * 2 + 10); // 威力数値化
            
            // 画面揺れ演出
            document.body.style.transform = 'translate(5px, 5px)';
            setTimeout(() => { document.body.style.transform = 'translate(-5px, -3px)'; }, 50);
            setTimeout(() => { document.body.style.transform = 'translate(0, 0)'; }, 100);

            showBanner(`威力: ${powerScore} ! 抜き取り成功！`);

            // 選択されたブロックを物理ワールドから外して飛ばす / 獲得処理
            if (selectedBlock) {
                const targetObj = blocks.find(b => b.mesh === selectedBlock);
                if (targetObj) {
                    // 物理的に勢いをつけて弾き飛ばす
                    targetObj.body.velocity.set(0, 5, 10);
                    targetObj.body.angularVelocity.set(5, 5, 0);
                }
                score++;
                document.getElementById('score-count').textContent = score;
            }

            // 状態リセット
            setTimeout(() => {
                isActionActive = false;
                document.getElementById('punch-btn').classList.remove('active');
                selectedBlock = null;
            }, 1500);
        }

        // バナーメッセージ表示
        function showBanner(text) {
            messageBanner.textContent = text;
            messageBanner.style.opacity = '1';
            setTimeout(() => {
                messageBanner.style.opacity = '0';
            }, 2500);
        }

        // --- メインループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (world) {
                world.step(1 / 60, delta, 3);

                // Three.js と Cannon.js の位置・姿勢同期
                for (let i = 0; i < blocks.length; i++) {
                    blocks[i].mesh.position.copy(blocks[i].body.position);
                    blocks[i].mesh.quaternion.copy(blocks[i].body.quaternion);
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
