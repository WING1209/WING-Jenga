<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ジェンガアタック</title>
    <!-- Three.js & Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #pc-block-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        @media (min-width: 769px) {
            #pc-block-overlay { display: flex; }
        }

        #canvas-container {
            width: 100%;
            height: 65%;
            position: relative;
            touch-action: none;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
        }

        .cam-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
        }
        #cam-left { left: 10px; }
        #cam-right { right: 10px; }

        #gui-container {
            width: 100%;
            height: 35%;
            background: rgba(20, 20, 30, 0.98);
            border-top: 2px solid #444;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            z-index: 10;
        }

        .gui-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .player-list-mini {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 70%;
        }
        .player-card {
            background: #2a2a3a;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            min-width: 75px;
            border: 1px solid #555;
        }
        .player-card.active {
            border-color: #ffcc00;
            background: #3a3a2a;
        }
        .player-card .hp-bar {
            height: 6px;
            background: #ff4444;
            width: 100%;
            margin-top: 3px;
            border-radius: 3px;
        }

        .timer-box {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            background: #000;
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid #ffcc00;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .item-btn {
            background: #334;
            color: #888;
            border: 1px solid #555;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        .item-btn.active {
            background: #ff9900;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 6px #ff9900;
        }

        .controls-info {
            background: #223344;
            color: #aaddff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid #446688;
            font-weight: bold;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .hidden { display: none !important; }

        .title-logo {
            font-size: 38px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000, 3px 3px 0px #fff;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
        }
        .blink-text {
            animation: blink 1.2s infinite;
            font-size: 18px;
            color: #ffff00;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .menu-box {
            width: 90%;
            max-width: 320px;
            background: #222;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }
        .menu-btn {
            background: #444;
            color: #fff;
            padding: 14px;
            border: 1px solid #777;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu-btn:active { background: #666; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #666;
            background: #111;
            color: #fff;
        }

        #huge-count {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 90px;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0000;
            z-index: 50;
            pointer-events: none;
        }

        #power-gauge-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(0,0,0,0.92);
            border: 2px solid #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 60;
        }
        .gauge-bar-bg {
            width: 100%;
            height: 35px;
            background: linear-gradient(to right, blue 0%, red 100%);
            position: relative;
            margin: 15px 0;
            border-radius: 17px;
            overflow: hidden;
        }
        .gauge-pointer {
            width: 6px;
            height: 100%;
            background: #fff;
            position: absolute;
            top: 0; left: 0%;
            box-shadow: 0 0 5px #000;
        }
        .power-impact-text {
            font-size: 32px;
            font-weight: 900;
            color: #ff3300;
            text-shadow: 0 0 10px #ffff00;
        }
        .guard-impact-text {
            font-size: 28px;
            font-weight: 900;
            color: #0099ff;
            text-shadow: 0 0 10px #00ffff;
        }

        .target-select-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        #spit-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            pointer-events: none;
            z-index: 80;
            background: radial-gradient(circle at 30% 40%, rgba(200,255,0,0.4) 0%, transparent 20%),
                        radial-gradient(circle at 70% 60%, rgba(150,255,0,0.5) 0%, transparent 25%),
                        radial-gradient(circle at 50% 20%, rgba(220,255,0,0.3) 0%, transparent 15%);
        }

        .shake {
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-5px, -10px); }
            80% { transform: translate(5px, 10px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

<div id="pc-block-overlay">
    <h2 style="color: #ff3333; margin-bottom: 15px;">⚠️ スマホ専用ゲームです</h2>
    <p style="font-size: 14px; color: #ccc; line-height: 1.6;">
        このゲームはスマートフォン専用です。<br>
        スマートフォン（またはブラウザの開発者ツールでスマホビュー）よりアクセスしてください。
    </p>
</div>

<div id="app-container">
    <div id="canvas-container">
        <canvas id="three-canvas"></canvas>
        <div class="cam-arrow" id="cam-left" onclick="rotateCam(-1)">‹</div>
        <div class="cam-arrow" id="cam-right" onclick="rotateCam(1)">›</div>
        <div id="huge-count" class="hidden">40</div>
        <div id="spit-overlay" class="hidden"></div>
    </div>

    <div id="gui-container">
        <div class="gui-row">
            <div class="player-list-mini" id="gui-player-list"></div>
            <div class="timer-box" id="gui-timer">40</div>
        </div>

        <div class="item-grid">
            <div class="item-btn" id="item-ojama" onclick="useItem('ojama')">お邪魔<br><span id="count-ojama">0</span></div>
            <div class="item-btn" id="item-sneeze" onclick="useItem('sneeze')">くしゃみ<br><span id="count-sneeze">0</span></div>
            <div class="item-btn" id="item-renzoku" onclick="useItem('renzoku')">連続<br><span id="count-renzoku">0</span></div>
            <div class="item-btn" id="item-pass" onclick="useItem('pass')">パス<br><span id="count-pass">0</span></div>
            <div class="item-btn" id="item-ganriki" onclick="useItem('ganriki')">眼力<br><span id="count-ganriki">0</span></div>
            <div class="item-btn" id="item-rob" onclick="useItem('rob')">強奪<br><span id="count-rob">0</span></div>
        </div>

        <div class="controls-info">
            💡 左右矢印: 回転 | ダブルタップ: 近接/全体 | 上下スワイプ: 高さ移動
        </div>
    </div>

    <div id="title-screen" class="overlay">
        <div class="title-logo">ジェンガアタックVer1.0</div>
        <div class="blink-text" onclick="showMenu()">TAP TO START</div>
    </div>

    <div id="menu-screen" class="overlay hidden">
        <div class="menu-box" id="menu-main">
            <h3>メインメニュー</h3>
            <button class="menu-btn" onclick="selectHost()">１．ホスト</button>
            <button class="menu-btn" onclick="selectGuest()">２．ゲスト</button>
            <button class="menu-btn" onclick="location.reload()">３．終了</button>
        </div>

        <div class="menu-box hidden" id="menu-host">
            <h3>人数選択</h3>
            <div style="display:flex; gap:5px; justify-content:center;">
                <button class="menu-btn" onclick="setPlayerCount(1)">1</button>
                <button class="menu-btn" onclick="setPlayerCount(2)">2</button>
                <button class="menu-btn" onclick="setPlayerCount(3)">3</button>
                <button class="menu-btn" onclick="setPlayerCount(4)">4</button>
                <button class="menu-btn" onclick="setPlayerCount(5)">5</button>
            </div>
        </div>

        <div class="menu-box hidden" id="menu-name">
            <h3>プレイヤーネーム</h3>
            <p style="font-size:11px; color:#aaa;">(ひらがな・数字 6文字まで)</p>
            <input type="text" id="player-name-input" maxlength="6" placeholder="なまえ">
            <button class="menu-btn" onclick="submitName()">決定</button>
        </div>

        <div class="menu-box hidden" id="menu-lobby">
            <h3>接続待機中...</h3>
            <div class="blink-text" style="font-size:24px;" id="room-id-display">ID: ----</div>
            <div id="joined-players-list" style="text-align:left; font-size:12px; margin:10px 0;"></div>
            <button class="menu-btn hidden" id="btn-start-game" onclick="startOrderRoulette()">ゲーム開始</button>
        </div>

        <div class="menu-box hidden" id="menu-guest-id">
            <h3>接続ID入力 (4桁)</h3>
            <input type="text" id="guest-id-input" maxlength="4" placeholder="1234">
            <button class="menu-btn" onclick="connectGuest()">接続</button>
        </div>
    </div>

    <div id="popup-overlay" class="overlay hidden">
        <div class="menu-box" id="popup-content">
            <h3 id="popup-title">タイトル</h3>
            <div id="popup-body">本文</div>
            <button class="menu-btn" id="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <div id="power-gauge-overlay" class="hidden">
        <h3 id="gauge-owner-title">ターンプレイヤー</h3>
        <div class="gauge-bar-bg">
            <div class="gauge-pointer" id="gauge-pointer"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:10px;">
            <span>0📶</span><span>100</span>
        </div>
        <div id="gauge-val-display" style="font-size:22px; font-weight:bold; margin:8px 0;">50</div>
        <button class="menu-btn" id="gauge-stop-btn" onclick="stopGauge()">STOP!</button>
    </div>
</div>

<script>
const STATE = {
    mode: 'TITLE',
    isHost: false,
    playerCount: 1,
    myIndex: 0,
    players: [],
    turnIndex: 0,
    timer: 40,
    timerInterval: null,
    selectedBlock: null,
    camAngle: 0,
    camHeight: 12,
    isZoomed: false,
    activeItem: null,
    gaugeRunning: false,
    gaugeSpeed: 2,
    gaugePos: 0,
    gaugeDir: 1,
    powerScore: 0,
    guardScore: 0,
    phase: 'SELECT',
    physicsActive: false,
    targetPlayerIndex: 0,
    angleHVal: 50,
    angleVVal: 50
};

const HAND_SKINS = [
    { skin: 0xffdbac, nail: 0xff0055 },
    { skin: 0x8d5524, nail: 0x00ffff },
    { skin: 0xe0ac69, nail: 0x9900cc },
    { skin: 0xf1c27d, nail: 0x00ff00 },
    { skin: 0xc68642, nail: 0xff6600 }
];

let scene, camera, renderer, world;
let blocks = [];
let handMeshes = [];
let trajectoryLine = null;

function init3D() {
    const container = document.getElementById('canvas-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    updateCameraPosition();

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 30, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    createEnvironment();

    world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 20;

    const woodMaterial = new CANNON.Material('wood');
    const contactMaterial = new CANNON.ContactMaterial(woodMaterial, woodMaterial, {
        friction: 0.6,
        restitution: 0.05
    });
    world.addContactMaterial(contactMaterial);

    createTable(woodMaterial);
    initTouchControls();
    animate();
}

function createEnvironment() {
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, transparent: true, opacity: 0.8 });
    for (let i = 0; i < 5; i++) {
        const cloudGroup = new THREE.Group();
        const count = 3 + Math.floor(Math.random() * 3);
        for (let j = 0; j < count; j++) {
            const geo = new THREE.SphereGeometry(1.5 + Math.random(), 8, 8);
            const mesh = new THREE.Mesh(geo, cloudMat);
            mesh.position.set(j * 1.5, Math.random() * 0.5, Math.random() * 1);
            cloudGroup.add(mesh);
        }
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 10;
        cloudGroup.position.set(Math.cos(angle) * dist, 15 + Math.random() * 10, Math.sin(angle) * dist);
        scene.add(cloudGroup);
    }

    const rainbowGeo = new THREE.TorusGeometry(18, 0.4, 16, 100, Math.PI);
    const rainbowMat = new THREE.MeshBasicMaterial({ color: 0xff6666, transparent: true, opacity: 0.4 });
    const rainbow = new THREE.Mesh(rainbowGeo, rainbowMat);
    rainbow.position.set(0, 10, 0);
    rainbow.rotation.x = Math.PI / 2;
    scene.add(rainbow);
}

function createTable(material) {
    const geo = new THREE.CylinderGeometry(6, 6, 1, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x442211, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = -0.5;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Cylinder(6, 6, 1, 32), material: material });
    groundBody.position.set(0, -0.5, 0);
    world.addBody(groundBody);
}

function buildJengaTower() {
    blocks.forEach(b => {
        scene.remove(b.mesh);
        world.remove(b.body);
    });
    blocks = [];

    const blockWidth = 1.0;
    const blockLength = 3.0;
    const blockHeight = 0.6;

    for (let val = 0; val < 20; val++) {
        const isRotated = (val % 2 === 1);
        for (let j = 0; j < 3; j++) {
            const offset = (j - 1) * (blockWidth + 0.02);

            const geometry = new THREE.BoxGeometry(
                isRotated ? blockLength : blockWidth,
                blockHeight,
                isRotated ? blockWidth : blockLength
            );
            
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xb58863 }),
                new THREE.MeshStandardMaterial({ color: 0xb58863 })
            ];

            const mesh = new THREE.Mesh(geometry, materials);
            const posX = isRotated ? 0 : offset;
            const posY = val * blockHeight + blockHeight / 2;
            const posZ = isRotated ? offset : 0;

            mesh.position.set(posX, posY, posZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(
                (isRotated ? blockLength : blockWidth) / 2,
                blockHeight / 2,
                (isRotated ? blockWidth : blockLength) / 2
            ));
            
            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.set(posX, posY, posZ);
            if (isRotated) {
                body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
            }
            world.addBody(body);

            blocks.push({
                mesh: mesh,
                body: body,
                id: `block_${val}_${j}`,
                tier: val + 1,
                isRotated: isRotated
            });
        }
    }
    STATE.physicsActive = false;
}

function createPlayerHands() {
    handMeshes.forEach(m => scene.remove(m));
    handMeshes = [];

    STATE.players.forEach((p, idx) => {
        const angle = (idx / STATE.players.length) * Math.PI * 2;
        const radius = 8;
        
        const group = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: p.handSkin.skin });
        const armGeo = new THREE.CylinderGeometry(0.4, 0.5, 3, 16);
        const arm = new THREE.Mesh(armGeo, skinMat);
        arm.rotation.x = Math.PI / 3;
        group.add(arm);

        group.position.set(Math.sin(angle) * radius, 3, Math.cos(angle) * radius);
        group.lookAt(0, 3, 0);

        scene.add(group);
        handMeshes.push(group);
    });
}

function activatePhysics() {
    if (STATE.physicsActive) return;
    STATE.physicsActive = true;

    blocks.forEach(b => {
        b.body.mass = 0.8;
        b.body.updateMassProperties();
    });
}

function updateCameraPosition() {
    const dist = STATE.isZoomed ? 7 : 22;
    const targetY = STATE.isZoomed ? STATE.camHeight : 12;
    const x = Math.sin(STATE.camAngle) * dist;
    const z = Math.cos(STATE.camAngle) * dist;
    camera.position.set(x, targetY, z);
    camera.lookAt(0, STATE.isZoomed ? STATE.camHeight : 6, 0);
}

function rotateCam(dir) {
    STATE.camAngle += dir * (Math.PI / 4);
    updateCameraPosition();
}

let lastTapTime = 0;
let touchStartY = 0;

function initTouchControls() {
    const container = document.getElementById('canvas-container');

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            touchStartY = e.touches[0].clientY;
            
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0) {
                STATE.isZoomed = !STATE.isZoomed;
                updateCameraPosition();
            }
            lastTapTime = currentTime;
        }
    }, {passive: true});

    container.addEventListener('touchmove', (e) => {
        if (STATE.isZoomed && e.touches.length === 1) {
            const touchY = e.touches[0].clientY;
            const diff = touchStartY - touchY;
            if (Math.abs(diff) > 20) {
                if (diff > 0) {
                    STATE.camHeight = Math.min(18, STATE.camHeight + 0.3);
                } else {
                    STATE.camHeight = Math.max(1, STATE.camHeight - 0.3);
                }
                touchStartY = touchY;
                updateCameraPosition();
            }
        }
    }, {passive: true});
}

function animate() {
    requestAnimationFrame(animate);

    if (STATE.mode === 'GAME' && STATE.physicsActive) {
        world.step(1 / 60);
        for (let i = 0; i < blocks.length; i++) {
            blocks[i].mesh.position.copy(blocks[i].body.position);
            blocks[i].mesh.quaternion.copy(blocks[i].body.quaternion);
        }
        checkCollapse();
    }

    if (STATE.gaugeRunning) {
        STATE.gaugePos += STATE.gaugeSpeed * STATE.gaugeDir;
        if (STATE.gaugePos >= 100 || STATE.gaugePos <= 0) {
            STATE.gaugeDir *= -1;
        }
        document.getElementById('gauge-pointer').style.left = STATE.gaugePos + '%';
        document.getElementById('gauge-val-display').innerText = Math.floor(STATE.gaugePos);
    }

    renderer.render(scene, camera);
}

function showMenu() {
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
    init3D();
}

function selectHost() {
    STATE.isHost = true;
    document.getElementById('menu-main').classList.add('hidden');
    document.getElementById('menu-host').classList.remove('hidden');
}

function selectGuest() {
    STATE.isHost = false;
    document.getElementById('menu-main').classList.add('hidden');
    document.getElementById('menu-name').classList.remove('hidden');
}

function setPlayerCount(num) {
    STATE.playerCount = num;
    document.getElementById('menu-host').classList.add('hidden');
    document.getElementById('menu-name').classList.remove('hidden');
}

function submitName() {
    const input = document.getElementById('player-name-input').value.trim();
    const regex = /^[ぁ-んー0-9]+$/;
    
    if (!input || input.length > 6 || (!regex.test(input) && input !== "debug")) {
        alert("ひらがな・数字のみ、6文字以内で入力してください。");
        return;
    }

    const myHand = HAND_SKINS[Math.floor(Math.random() * HAND_SKINS.length)];
    STATE.players.push({
        name: input,
        hp: 100,
        maxHp: 100,
        score: 0,
        items: { ojama:0, sneeze:0, renzoku:0, pass:0, ganriki:0, rob:0 },
        handSkin: myHand,
        isReady: false
    });

    document.getElementById('menu-name').classList.add('hidden');

    if (STATE.isHost) {
        document.getElementById('menu-lobby').classList.remove('hidden');
        const roomId = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-id-display').innerText = `ID: ${roomId}`;
        
        for (let i = 2; i <= STATE.playerCount; i++) {
            STATE.players.push({
                name: `つわもの${i}`,
                hp: 100, maxHp: 100, score: 0,
                items: { ojama:0, sneeze:0, renzoku:0, pass:0, ganriki:0, rob:0 },
                handSkin: HAND_SKINS[(i-1) % HAND_SKINS.length],
                isReady: false
            });
        }
        updateLobbyUI();
    } else {
        document.getElementById('menu-guest-id').classList.remove('hidden');
    }
}

function updateLobbyUI() {
    const list = document.getElementById('joined-players-list');
    list.innerHTML = "<b>参加プレイヤー:</b><br>" + STATE.players.map(p => `・${p.name}`).join('<br>');
    if (STATE.players.length >= STATE.playerCount) {
        document.getElementById('btn-start-game').classList.remove('hidden');
    }
}

function connectGuest() {
    const id = document.getElementById('guest-id-input').value;
    if (id.length === 4) {
        document.getElementById('menu-guest-id').innerHTML = "<h3>接続成功！</h3><p>ホストの開始を待っています...</p>";
        setTimeout(() => {
            STATE.players.unshift({ name: "ホスト", hp: 100, maxHp: 100, score: 0, items:{}, handSkin: HAND_SKINS[0], isReady: false });
            startOrderRoulette();
        }, 1500);
    } else {
        alert("4桁のIDを入力してください");
    }
}

// 順番決めルーレット（ホストのみストップ操作可能）
function startOrderRoulette() {
    document.getElementById('menu-screen').classList.add('hidden');
    
    let speed = 50;
    let idx = 0;
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.remove('hidden');
    
    document.getElementById('popup-title').innerText = "順番決めルーレット";
    
    const timer = setInterval(() => {
        document.getElementById('popup-body').innerText = `▶ ${STATE.players[idx % STATE.players.length].name} ◀`;
        idx++;
    }, speed);

    const btn = document.getElementById('popup-btn');
    if (STATE.isHost) {
        btn.innerText = "ストップ！（ホスト操作）";
        btn.classList.remove('hidden');
        btn.onclick = () => {
            clearInterval(timer);
            stopRouletteResult();
        };
    } else {
        btn.innerText = "ホストがルーレットを停止するのを待っています...";
        btn.classList.add('hidden'); // ゲストは停止ボタンを押せない
    }
}

function stopRouletteResult() {
    document.getElementById('app-container').classList.add('shake');
    setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 500);

    STATE.players.sort(() => Math.random() - 0.5);
    STATE.players.forEach(p => p.isReady = false); // 確認状態リセット
    
    showPlayerConfirmationScreen();
}

// 各プレイヤーが確認タップして準備する画面
function showPlayerConfirmationScreen() {
    document.getElementById('popup-title').innerText = "順番確認 & 準備";
    
    let html = `<div style="font-size:12px; margin-bottom:8px; color:#aaa;">各プレイヤーは自分の名前をタップして準備を完了してください：</div>`;
    html += `<div style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; text-align:left;">`;
    
    STATE.players.forEach((p, i) => {
        const btnBg = p.isReady ? '#006600' : '#444';
        const btnText = p.isReady ? '✅ 準備完了' : '👉 タップして確認';
        html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#333; padding:6px 10px; border-radius:4px;">
            <span><b>${i + 1}番:</b> ${p.name}</span>
            <button class="menu-btn" style="padding:4px 10px; font-size:11px; background:${btnBg};" onclick="confirmPlayerReady(${i})">${btnText}</button>
        </div>`;
    });
    html += `</div>`;

    const allReady = STATE.players.every(p => p.isReady);
    const btn = document.getElementById('popup-btn');

    if (allReady && STATE.isHost) {
        html += `<br><button class="menu-btn" style="background:#ff3333; width:100%;" onclick="executeGameStart()">全プレイヤー準備完了 - ゲーム開始</button>`;
        btn.classList.add('hidden');
    } else {
        btn.classList.add('hidden');
        if (!STATE.isHost && allReady) {
            html += `<br><div style="color:#ffcc00; font-size:12px; text-align:center;">ホストのゲーム開始ボタンをお待ちください...</div>`;
        } else if (!allReady) {
            html += `<br><div style="color:#aaa; font-size:11px; text-align:center;">全員の確認が完了するとホストに開始ボタンが表示されます。</div>`;
        }
    }

    document.getElementById('popup-body').innerHTML = html;
    document.getElementById('popup-overlay').classList.remove('hidden');
}

window.confirmPlayerReady = function(index) {
    STATE.players[index].isReady = true;
    showPlayerConfirmationScreen();
};

function executeGameStart() {
    closePopup();
    startGame();
}

function startGame() {
    STATE.mode = 'GAME';
    buildJengaTower();
    createPlayerHands();
    updateGUI();
    startTurn();
}

function startTurn() {
    STATE.phase = 'SELECT';
    STATE.timer = 40;
    document.getElementById('huge-count').classList.add('hidden');
    
    updateGUI();

    if (STATE.timerInterval) clearInterval(STATE.timerInterval);
    STATE.timerInterval = setInterval(() => {
        STATE.timer--;
        document.getElementById('gui-timer').innerText = STATE.timer;
        
        if (STATE.timer <= 5 && STATE.timer > 0) {
            const hc = document.getElementById('huge-count');
            hc.classList.remove('hidden');
            hc.innerText = STATE.timer;
        }

        if (STATE.timer <= 0) {
            clearInterval(STATE.timerInterval);
            nextTurn();
        }
    }, 1000);
}

function nextTurn() {
    clearInterval(STATE.timerInterval);
    document.getElementById('spit-overlay').classList.add('hidden');
    if (trajectoryLine) { scene.remove(trajectoryLine); trajectoryLine = null; }
    STATE.turnIndex = (STATE.turnIndex + 1) % STATE.players.length;
    startTurn();
}

function updateGUI() {
    const container = document.getElementById('gui-player-list');
    container.innerHTML = '';
    STATE.players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === STATE.turnIndex ? 'active' : ''}`;
        card.innerHTML = `
            <div><b>${p.name}</b></div>
            <div>獲:${p.score}本</div>
            <div class="hp-bar" style="width:${(p.hp/p.maxHp)*100}%"></div>
        `;
        container.appendChild(card);
    });

    const curP = STATE.players[STATE.turnIndex];
    ['ojama', 'sneeze', 'renzoku', 'pass', 'ganriki', 'rob'].forEach(item => {
        const cnt = curP.items[item] || 0;
        document.getElementById(`count-${item}`).innerText = cnt;
        const btn = document.getElementById(`item-${item}`);
        if (cnt > 0) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

// ブロック選択タップ判定（ターンプレイヤーのみ操作可能）
window.addEventListener('pointerdown', (e) => {
    if (STATE.mode !== 'GAME' || STATE.phase !== 'SELECT') return;

    // パス＆プレイ環境においてターンのプレイヤーの手番であることを確認
    const rect = renderer.domElement.getBoundingClientRect();
    if (e.clientY < rect.top || e.clientY > rect.bottom || e.clientX < rect.left || e.clientX > rect.right) return;

    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

    if (intersects.length > 0) {
        const hit = intersects[0];
        const targetMesh = hit.object;
        const blockObj = blocks.find(b => b.mesh === targetMesh);

        if (blockObj) {
            const localPoint = blockObj.mesh.worldToLocal(hit.point.clone());
            const halfLen = blockObj.isRotated ? 1.5 : 0.5;
            const isShortSideHit = Math.abs(blockObj.isRotated ? localPoint.x : localPoint.z) >= halfLen - 0.2;

            if (!isShortSideHit) {
                showPopup("注意", "そこは押せません！棒の短側面（端っこ）をタップしてください。", "OK");
                return;
            }

            if (!STATE.isZoomed) {
                showPopup("注意", "ブロックを近く（近接ビュー）にしてから選択してください。（画面をダブルタップ）", "OK");
                return;
            }

            STATE.selectedBlock = blockObj;
            selectTargetPlayer();
        }
    }
});

function selectTargetPlayer() {
    STATE.phase = 'TARGET_SELECT';
    let html = `<div class="target-select-list">`;
    STATE.players.forEach((p, i) => {
        if (i !== STATE.turnIndex) {
            html += `<button class="menu-btn" onclick="confirmTarget(${i})">${p.name} (HP: ${p.hp})</button>`;
        }
    });
    html += `</div>`;
    showPopup("攻撃対象選択", "攻撃するプレイヤーを選んでください：<br>" + html, "", null);
}

window.confirmTarget = function(targetIdx) {
    STATE.targetPlayerIndex = targetIdx;
    closePopup();
    startAngleSelectionH();
};

function startAngleSelectionH() {
    STATE.phase = 'ANGLE_H';
    openPowerGauge('ANGLE_H');
}

function startAngleSelectionV() {
    STATE.phase = 'ANGLE_V';
    openPowerGauge('ANGLE_V');
}

function openPowerGauge(type) {
    const overlay = document.getElementById('power-gauge-overlay');
    overlay.classList.remove('hidden');
    
    STATE.gaugeRunning = true;
    STATE.gaugePos = 0;
    STATE.gaugeSpeed = Math.random() * 3 + 2;

    const curP = STATE.players[STATE.turnIndex];
    const targetP = STATE.players[STATE.targetPlayerIndex];

    if (type === 'ANGLE_H') {
        document.getElementById('gauge-owner-title').innerText = `【${curP.name}のターン】横軸角度決定`;
    } else if (type === 'ANGLE_V') {
        document.getElementById('gauge-owner-title').innerText = `【${curP.name}のターン】縦軸角度決定`;
    } else if (type === 'POWER') {
        document.getElementById('gauge-owner-title').innerText = `【${curP.name}のターン】攻撃パワー決定`;
    } else if (type === 'GUARD') {
        // 防御時：対象プレイヤーのみが操作可能であることを明示
        document.getElementById('gauge-owner-title').innerText = `🛡️ 【${targetP.name}の防御ターン】防御ゲージをストップ！`;
    }
}

function stopGauge() {
    if (!STATE.gaugeRunning) return;
    
    // アクションの切り分け：GUARDフェーズのときは対象プレイヤーのみがストップ操作を行える
    STATE.gaugeRunning = false;
    
    const val = Math.floor(STATE.gaugePos);
    document.getElementById('power-gauge-overlay').classList.add('hidden');

    if (STATE.phase === 'ANGLE_H') {
        STATE.angleHVal = val;
        setTimeout(startAngleSelectionV, 400);
    } else if (STATE.phase === 'ANGLE_V') {
        STATE.angleVVal = val;
        showTrajectoryPreview();
    } else if (STATE.phase === 'POWER') {
        STATE.powerScore = val;
        STATE.phase = 'GUARD';
        showPopup("パワー確定！", `<span class="power-impact-text">${val} POWER</span>`, "相手ガード判定へ", () => {
            openPowerGauge('GUARD');
        });
    } else if (STATE.phase === 'GUARD') {
        STATE.guardScore = val;
        resolveBattleResult();
    }
}

function showTrajectoryPreview() {
    STATE.isZoomed = false;
    STATE.camAngle = 0;
    updateCameraPosition();

    if (STATE.selectedBlock) {
        const bPos = STATE.selectedBlock.mesh.position;
        const points = [];
        points.push(new THREE.Vector3(bPos.x, bPos.y, bPos.z));
        points.push(new THREE.Vector3(bPos.x + (STATE.angleHVal - 50) * 0.1, bPos.y + (STATE.angleVVal - 50) * 0.1, bPos.z - 10));

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineDashedMaterial({ color: 0xff0000, dashSize: 0.5, gapSize: 0.3 });
        trajectoryLine = new THREE.Line(geometry, material);
        trajectoryLine.computeLineDistances();
        scene.add(trajectoryLine);
    }

    showPopup("軌道確認", "全体図の赤い点線が打ち抜き位置と角度です。", "攻撃パワー決定へ", () => {
        if (trajectoryLine) { scene.remove(trajectoryLine); trajectoryLine = null; }
        STATE.phase = 'POWER';
        openPowerGauge('POWER');
    });
}

function resolveBattleResult() {
    const diff = STATE.powerScore - STATE.guardScore;
    const turnP = STATE.players[STATE.turnIndex];
    const targetP = STATE.players[STATE.targetPlayerIndex];

    let msg = `<div class="power-impact-text">${STATE.powerScore} POWER</div>`;
    msg += `<div class="guard-impact-text">VS ${STATE.guardScore} GUARD</div><br>`;

    if (diff <= 0) {
        msg += `<b style="color:#00ff00;">ガード成功！ダメージなし</b>`;
    } else {
        const damage = Math.ceil(diff / 10);
        targetP.hp = Math.max(0, targetP.hp - damage);
        msg += `<b style="color:#ff3333;">${targetP.name} に ${damage} のダメージ！</b>`;
        
        document.getElementById('app-container').classList.add('shake');
        setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);
    }

    if (STATE.powerScore === 100) {
        msg += `<br><b style="color:#ffff00;">★ CRITICAL BREAK ★</b>`;
    }

    activatePhysics();

    if (STATE.selectedBlock) {
        const pushForce = (STATE.powerScore / 50) * 8;
        const dirZ = STATE.selectedBlock.isRotated ? 0 : -pushForce;
        const dirX = STATE.selectedBlock.isRotated ? -pushForce : 0;

        STATE.selectedBlock.body.applyImpulse(
            new CANNON.Vec3(dirX, 0, dirZ),
            STATE.selectedBlock.body.position
        );
        turnP.score++;
        rollItemReward(turnP);
    }

    showPopup("結果発表", msg, "ターン終了", () => {
        if (targetP.hp <= 0) {
            alert(`${targetP.name} 脱落！`);
        }
        nextTurn();
    });
}

function rollItemReward(player) {
    if (Math.random() < 0.5) return;

    const itemList = ['ojama', 'sneeze', 'renzoku', 'pass', 'ganriki', 'rob'];
    const reward = itemList[Math.floor(Math.random() * itemList.length)];
    
    if ((player.items[reward] || 0) < 5) {
        player.items[reward] = (player.items[reward] || 0) + 1;
        setTimeout(() => {
            showPopup("アイテムGET！", `ルーレットの結果...<br><b>【${reward.toUpperCase()}】</b> を獲得！`, "OK");
        }, 1000);
    }
}

function useItem(type) {
    const p = STATE.players[STATE.turnIndex];
    if (!p.items[type] || p.items[type] <= 0) return;

    p.items[type]--;
    updateGUI();

    if (type === 'pass') {
        showPopup("アイテム発動", "【パス】を使用しました。ターンをスキップします。", "OK", () => nextTurn());
    } else if (type === 'sneeze') {
        document.getElementById('spit-overlay').classList.remove('hidden');
        showPopup("アイテム発動", "【くしゃみ】発動！画面が汚れた！", "OK");
    } else if (type === 'ganriki') {
        const target = blocks[blocks.length - 1];
        if (target) {
            target.mesh.material.forEach(m => m.color.setHex(0x00ffff));
        }
        showPopup("アイテム発動", "【眼力】発動！安全なブロックが青く輝いた！", "OK");
    } else if (type === 'rob') {
        const targetP = STATE.players[(STATE.turnIndex + 1) % STATE.players.length];
        targetP.hp = Math.max(0, targetP.hp - 10);
        p.hp += 10;
        showPopup("アイテム発動", `【強奪】発動！ ${targetP.name} から体力を奪い取った！`, "OK");
    } else {
        showPopup("アイテム発動", `【${type.toUpperCase()}】を発動しました！`, "OK");
    }
}

function checkCollapse() {
    for (let b of blocks) {
        if (b.body.position.y < 0 || Math.abs(b.body.position.x) > 4 || Math.abs(b.body.position.z) > 4) {
            triggerGameOver();
            break;
        }
    }
}

function triggerGameOver() {
    STATE.mode = 'OVER';
    clearInterval(STATE.timerInterval);

    const rankings = [...STATE.players].sort((a, b) => (b.score + b.hp) - (a.score + a.hp));
    const winner = rankings[0];

    let html = `<h2 style="color:#ffcc00;">👑 ${winner.name} WIN! 👑</h2><br>`;
    html += rankings.map((p, i) => `${i + 1}位: 👑 ${p.name} (獲得:${p.score} / HP:${p.hp})`).join('<br>');

    showPopup("倒壊！ゲーム終了", html, "リトライ / 終了", () => {
        location.reload();
    });
}

function showPopup(title, body, btnText = "OK", callback = null) {
    const overlay = document.getElementById('popup-overlay');
    document.getElementById('popup-title').innerText = title;
    document.getElementById('popup-body').innerHTML = body;
    const btn = document.getElementById('popup-btn');
    if (btnText === "") {
        btn.classList.add('hidden');
    } else {
        btn.classList.remove('hidden');
        btn.innerText = btnText;
        btn.onclick = () => {
            overlay.classList.add('hidden');
            if (callback) callback();
        };
    }
    overlay.classList.remove('hidden');
}

function closePopup() {
    document.getElementById('popup-overlay').classList.add('hidden');
}
</script>
