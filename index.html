<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ジェンガアタック</title>
    <!-- Three.js (3D描画) & Cannon.js (物理演算) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            color: #fff;
        }

        /* 全体コンテナ（画面比率フィット） */
        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
        }

        /* 3Dキャンバス領域 (70%) */
        #canvas-container {
            width: 100%;
            height: 70%;
            position: relative;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
        }

        /* 右側/下部 GUI領域 (30%) */
        #gui-container {
            width: 100%;
            height: 30%;
            background: rgba(20, 20, 30, 0.95);
            border-top: 2px solid #444;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
            z-index: 10;
        }

        /* GUI内部 レイアウト */
        .gui-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .player-list-mini {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            width: 70%;
        }
        .player-card {
            background: #2a2a3a;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 10px;
            min-width: 65px;
            border: 1px solid #555;
        }
        .player-card.active {
            border-color: #ffcc00;
            background: #3a3a2a;
        }
        .player-card .hp-bar {
            height: 4px;
            background: #ff4444;
            width: 100%;
            margin-top: 2px;
            border-radius: 2px;
        }

        .timer-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            background: #000;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ffcc00;
        }

        /* アイテムボタン群 */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        .item-btn {
            background: #334;
            color: #888;
            border: 1px solid #555;
            padding: 6px 0;
            font-size: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .item-btn.active {
            background: #ff9900;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 5px #ff9900;
        }

        /* 操作ボタン群 */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .ctrl-btn {
            background: #225588;
            color: white;
            border: none;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }
        .ctrl-btn:active { background: #3377bb; }

        /* オーバーレイ表示（タイトル、メニュー、ポップアップ） */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .hidden { display: none !important; }

        /* タイトル画面 */
        .title-logo {
            font-size: 36px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000, 3px 3px 0px #fff;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
        }
        .blink-text {
            animation: blink 1.2s infinite;
            font-size: 18px;
            color: #ffff00;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* メニューUI */
        .menu-box {
            width: 90%;
            max-width: 320px;
            background: #222;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }
        .menu-btn {
            background: #444;
            color: #fff;
            padding: 12px;
            border: 1px solid #777;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }
        .menu-btn:active { background: #666; }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #666;
            background: #111;
            color: #fff;
        }

        /* ゲーミング＆演出オーバーレイ */
        #huge-count {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 90px;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0000;
            z-index: 50;
            pointer-events: none;
        }
        #power-gauge-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(0,0,0,0.9);
            border: 2px solid #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            z-index: 60;
        }
        .gauge-bar-bg {
            width: 100%;
            height: 30px;
            background: linear-gradient(to right, blue 0%, red 100%);
            position: relative;
            margin: 10px 0;
            border-radius: 15px;
            overflow: hidden;
        }
        .gauge-pointer {
            width: 6px;
            height: 100%;
            background: #fff;
            position: absolute;
            top: 0; left: 0%;
            box-shadow: 0 0 5px #000;
        }
        .power-impact-text {
            font-size: 32px;
            font-weight: 900;
            color: #ff3300;
            text-shadow: 0 0 10px #ffff00;
        }
        .guard-impact-text {
            font-size: 28px;
            font-weight: 900;
            color: #0099ff;
            text-shadow: 0 0 10px #00ffff;
        }

        /* くしゃみ演出汚れ */
        #spit-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            pointer-events: none;
            z-index: 80;
            background: radial-gradient(circle at 30% 40%, rgba(200,255,0,0.4) 0%, transparent 20%),
                        radial-gradient(circle at 70% 60%, rgba(150,255,0,0.5) 0%, transparent 25%),
                        radial-gradient(circle at 50% 20%, rgba(220,255,0,0.3) 0%, transparent 15%);
        }

        /* 画面シェイク animation */
        .shake {
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-5px, -10px); }
            80% { transform: translate(5px, 10px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 3D 視界エリア -->
    <div id="canvas-container">
        <canvas id="three-canvas"></canvas>
        <div id="huge-count" class="hidden">5</div>
        <div id="spit-overlay" class="hidden"></div>
    </div>

    <!-- GUIコントロールエリア -->
    <div id="gui-container">
        <div class="gui-row">
            <div class="player-list-mini" id="gui-player-list"></div>
            <div class="timer-box" id="gui-timer">20</div>
        </div>

        <!-- アイテムボタン一覧 -->
        <div class="item-grid">
            <div class="item-btn" id="item-ojama" onclick="useItem('ojama')">お邪魔<br><span id="count-ojama">0</span></div>
            <div class="item-btn" id="item-sneeze" onclick="useItem('sneeze')">くしゃみ<br><span id="count-sneeze">0</span></div>
            <div class="item-btn" id="item-renzoku" onclick="useItem('renzoku')">連続<br><span id="count-renzoku">0</span></div>
            <div class="item-btn" id="item-pass" onclick="useItem('pass')">パス<br><span id="count-pass">0</span></div>
            <div class="item-btn" id="item-ganriki" onclick="useItem('ganriki')">眼力<br><span id="count-ganriki">0</span></div>
            <div class="item-btn" id="item-rob" onclick="useItem('rob')">強奪<br><span id="count-rob">0</span></div>
        </div>

        <!-- 操作ボタン一覧 -->
        <div class="controls-grid">
            <button class="ctrl-btn" onclick="setViewMode('all')">全体</button>
            <button class="ctrl-btn" onclick="cycleFace()">面 <span id="face-num">1</span></button>
            <button class="ctrl-btn" onclick="setViewMode('zoom')">近接</button>
            <button class="ctrl-btn" onclick="cycleTier()">段数 <span id="tier-num">1</span></button>
        </div>
    </div>

    <!-- UI Overlay : タイトル画面 -->
    <div id="title-screen" class="overlay">
        <div class="title-logo">ジェンガアタック</div>
        <div class="blink-text" onclick="showMenu()">TAP TO START</div>
    </div>

    <!-- UI Overlay : メニュー画面 -->
    <div id="menu-screen" class="overlay hidden">
        <div class="menu-box" id="menu-main">
            <h3>メインメニュー</h3>
            <button class="menu-btn" onclick="selectHost()">１．ホスト</button>
            <button class="menu-btn" onclick="selectGuest()">２．ゲスト</button>
            <button class="menu-btn" onclick="location.reload()">３．終了</button>
        </div>

        <!-- ホスト設定 -->
        <div class="menu-box hidden" id="menu-host">
            <h3>人数選択</h3>
            <div style="display:flex; gap:5px; justify-content:center;">
                <button class="menu-btn" onclick="setPlayerCount(1)">1</button>
                <button class="menu-btn" onclick="setPlayerCount(2)">2</button>
                <button class="menu-btn" onclick="setPlayerCount(3)">3</button>
                <button class="menu-btn" onclick="setPlayerCount(4)">4</button>
                <button class="menu-btn" onclick="setPlayerCount(5)">5</button>
            </div>
        </div>

        <!-- 名前入力 -->
        <div class="menu-box hidden" id="menu-name">
            <h3>プレイヤーネーム</h3>
            <p style="font-size:11px; color:#aaa;">(ひらがな・数字 6文字まで)</p>
            <input type="text" id="player-name-input" maxlength="6" placeholder="なまえ">
            <button class="menu-btn" onclick="submitName()">決定</button>
        </div>

        <!-- 接続待機（ホスト） -->
        <div class="menu-box hidden" id="menu-lobby">
            <h3>接続待機中...</h3>
            <div class="blink-text" style="font-size:24px;" id="room-id-display">ID: ----</div>
            <div id="joined-players-list" style="text-align:left; font-size:12px; margin:10px 0;"></div>
            <button class="menu-btn hidden" id="btn-start-game" onclick="startOrderRoulette()">ゲーム開始</button>
        </div>

        <!-- ゲスト接続ID入力 -->
        <div class="menu-box hidden" id="menu-guest-id">
            <h3>接続ID入力 (4桁)</h3>
            <input type="text" id="guest-id-input" maxlength="4" placeholder="1234">
            <button class="menu-btn" onclick="connectGuest()">接続</button>
        </div>
    </div>

    <!-- UI Overlay : 汎用ポップアップ / ルーレット / ゲージ判定 -->
    <div id="popup-overlay" class="overlay hidden">
        <div class="menu-box" id="popup-content">
            <h3 id="popup-title">タイトル</h3>
            <p id="popup-body">本文</p>
            <button class="menu-btn" id="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <!-- 威力/ガード決定 ゲージ -->
    <div id="power-gauge-overlay" class="hidden">
        <h3 id="gauge-owner-title">ターンプレイヤー</h3>
        <div class="gauge-bar-bg">
            <div class="gauge-pointer" id="gauge-pointer"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:10px;">
            <span>0📶</span><span>100</span>
        </div>
        <div id="gauge-val-display" style="font-size:20px; font-weight:bold; margin:5px 0;">50</div>
        <button class="menu-btn" id="gauge-stop-btn" onclick="stopGauge()">STOP!</button>
    </div>
</div>

<script>
/* ==========================================================================
   1. ゲームデータ ＆ 状態管理 (State Management)
   ========================================================================== */
const STATE = {
    mode: 'TITLE', // TITLE, MENU, LOBBY, GAME, OVER
    isHost: false,
    playerCount: 1,
    myIndex: 0,
    players: [], // { name, hp, score, items: {}, handColor, tattoo }
    turnIndex: 0,
    timer: 20,
    timerInterval: null,
    selectedBlock: null,
    currentFace: 1,
    currentTier: 1,
    activeItem: null,
    gaugeRunning: false,
    gaugeVal: 0,
    gaugeSpeed: 2,
    gaugePos: 0,
    gaugeDir: 1,
    powerScore: 0,
    guardScore: 0,
    phase: 'SELECT' // SELECT, ANGLE_H, ANGLE_V, POWER, GUARD, EXECUTE
};

// 手の個性データ（ビジュアル演出用）
const HAND_SKINS = [
    { skin: 0xffdbac, nail: 0xff0055, length: 1.0 },
    { skin: 0x8d5524, nail: 0x00ffff, length: 1.2 },
    { skin: 0xe0ac69, nail: 0x9900cc, length: 0.9 },
    { skin: 0xf1c27d, nail: 0x00ff00, length: 1.1 },
    { skin: 0xc68642, nail: 0xff6600, length: 1.0 }
];

/* ==========================================================================
   2. Three.js ＆ Cannon.js (3Dグラフィックス＆物理エンジン設定)
   ========================================================================== */
let scene, camera, renderer, world;
let blocks = []; // { mesh, body, id, tier, isHighlighted }
let handMeshes = [];

function init3D() {
    const container = document.getElementById('canvas-container');
    
    // シーン
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    // カメラ
    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 12, 25);
    camera.lookAt(0, 6, 0);

    // レンダー
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;

    // 照明
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 物理ワールド
    world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 10;

    // 床・台座
    createTable();

    // ループ開始
    animate();
}

function createTable() {
    // 視覚用
    const geo = new THREE.CylinderGeometry(6, 6, 1, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x442211, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = -0.5;
    mesh.receiveShadow = true;
    scene.add(mesh);

    // 物理用
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Cylinder(6, 6, 1, 32) });
    groundBody.position.set(0, -0.5, 0);
    world.addBody(groundBody);
}

// ジェンガタワー構築（20段、1段3本）
function buildJengaTower() {
    // 既存ブロックの削除
    blocks.forEach(b => {
        scene.remove(b.mesh);
        world.remove(b.body);
    });
    blocks = [];

    const blockWidth = 1.0;
    const blockLength = 3.0;
    const blockHeight = 0.6;

    for (let val = 0; val < 20; val++) { // 20段
        const isRotated = (val % 2 === 1);
        for (let j = 0; j < 3; j++) { // 3本
            const offset = (j - 1) * (blockWidth + 0.05);

            // Three.js メッシュ
            const geometry = new THREE.BoxGeometry(
                isRotated ? blockLength : blockWidth,
                blockHeight,
                isRotated ? blockWidth : blockLength
            );
            
            // テクスチャ代わりに側面に「良夫」刻印用の色設定
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c }),
                new THREE.MeshStandardMaterial({ color: 0xb58863 }), // 刻印面イメージ
                new THREE.MeshStandardMaterial({ color: 0xb58863 })
            ];

            const mesh = new THREE.Mesh(geometry, materials);
            const posX = isRotated ? 0 : offset;
            const posY = val * (blockHeight + 0.02) + blockHeight / 2;
            const posZ = isRotated ? offset : 0;

            mesh.position.set(posX, posY, posZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Cannon.js 物理ボディ
            const shape = new CANNON.Box(new CANNON.Vec3(
                (isRotated ? blockLength : blockWidth) / 2,
                blockHeight / 2,
                (isRotated ? blockWidth : blockLength) / 2
            ));
            const body = new CANNON.Body({ mass: 0.8, shape: shape });
            body.position.set(posX, posY, posZ);
            if (isRotated) {
                body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
            }
            world.addBody(body);

            blocks.push({
                mesh: mesh,
                body: body,
                id: `block_${val}_${j}`,
                tier: val + 1,
                isHighlighted: false
            });
        }
    }
}

// 手の表示演出（各プレイヤーの手を周囲に配置）
function createPlayerHands() {
    handMeshes.forEach(m => scene.remove(m));
    handMeshes = [];

    STATE.players.forEach((p, idx) => {
        const angle = (idx / STATE.players.length) * Math.PI * 2;
        const radius = 8;
        
        const group = new THREE.Group();
        
        // 腕・手の簡易表現
        const skinMat = new THREE.MeshStandardMaterial({ color: p.handSkin.skin });
        const armGeo = new THREE.CylinderGeometry(0.4, 0.5, 3, 16);
        const arm = new THREE.Mesh(armGeo, skinMat);
        arm.rotation.x = Math.PI / 3;
        group.add(arm);

        group.position.set(Math.sin(angle) * radius, 3, Math.cos(angle) * radius);
        group.lookAt(0, 3, 0);

        scene.add(group);
        handMeshes.push(group);
    });
}

// 3Dアニメーションループ
function animate() {
    requestAnimationFrame(animate);

    // 物理演算更新（ゲーム実行中のみ）
    if (STATE.mode === 'GAME') {
        world.step(1 / 60);
        for (let i = 0; i < blocks.length; i++) {
            blocks[i].mesh.position.copy(blocks[i].body.position);
            blocks[i].mesh.quaternion.copy(blocks[i].body.quaternion);
        }
        checkCollapse();
    }

    // ゲージ進行処理
    if (STATE.gaugeRunning) {
        STATE.gaugePos += STATE.gaugeSpeed * STATE.gaugeDir;
        if (STATE.gaugePos >= 100 || STATE.gaugePos <= 0) {
            STATE.gaugeDir *= -1;
        }
        document.getElementById('gauge-pointer').style.left = STATE.gaugePos + '%';
        document.getElementById('gauge-val-display').innerText = Math.floor(STATE.gaugePos);
    }

    renderer.render(scene, camera);
}

/* ==========================================================================
   3. UI / メニュー / イベントフロー (Game Flow & Handlers)
   ========================================================================== */

function showMenu() {
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
    init3D();
}

function selectHost() {
    STATE.isHost = true;
    document.getElementById('menu-main').classList.add('hidden');
    document.getElementById('menu-host').classList.remove('hidden');
}

function selectGuest() {
    STATE.isHost = false;
    document.getElementById('menu-main').classList.add('hidden');
    document.getElementById('menu-name').classList.remove('hidden');
}

function setPlayerCount(num) {
    STATE.playerCount = num;
    document.getElementById('menu-host').classList.add('hidden');
    document.getElementById('menu-name').classList.remove('hidden');
}

function submitName() {
    const input = document.getElementById('player-name-input').value.trim();
    const regex = /^[ぁ-んー0-9]+$/;
    
    if (!input || input.length > 6 || (!regex.test(input) && input !== "debug")) {
        alert("ひらがな・数字のみ、6文字以内で入力してください。");
        return;
    }

    const myHand = HAND_SKINS[Math.floor(Math.random() * HAND_SKINS.length)];
    STATE.players.push({
        name: input,
        hp: 100,
        maxHp: 100,
        score: 0,
        items: { ojama:0, sneeze:0, renzoku:0, pass:0, ganriki:0, rob:0 },
        handSkin: myHand
    });

    document.getElementById('menu-name').classList.add('hidden');

    if (STATE.isHost) {
        document.getElementById('menu-lobby').classList.remove('hidden');
        const roomId = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-id-display').innerText = `ID: ${roomId}`;
        
        // ダミープレイヤーの補完（人数分）
        for (let i = 2; i <= STATE.playerCount; i++) {
            STATE.players.push({
                name: `つわもの${i}`,
                hp: 100, maxHp: 100, score: 0,
                items: { ojama:0, sneeze:0, renzoku:0, pass:0, ganriki:0, rob:0 },
                handSkin: HAND_SKINS[(i-1) % HAND_SKINS.length]
            });
        }
        updateLobbyUI();
    } else {
        document.getElementById('menu-guest-id').classList.remove('hidden');
    }
}

function updateLobbyUI() {
    const list = document.getElementById('joined-players-list');
    list.innerHTML = "<b>参加プレイヤー:</b><br>" + STATE.players.map(p => `・${p.name}`).join('<br>');
    if (STATE.players.length >= STATE.playerCount) {
        document.getElementById('btn-start-game').classList.remove('hidden');
    }
}

function connectGuest() {
    const id = document.getElementById('guest-id-input').value;
    if (id.length === 4) {
        // 接続成功演出
        document.getElementById('menu-guest-id').innerHTML = "<h3>接続成功！</h3><p>ホストの開始を待っています...</p>";
        setTimeout(() => {
            // ダミーでゲーム開始
            STATE.players.unshift({ name: "ホスト", hp: 100, maxHp: 100, score: 0, items:{}, handSkin: HAND_SKINS[0] });
            startOrderRoulette();
        }, 1500);
    } else {
        alert("4桁のIDを入力してください");
    }
}

// 順番決めルーレット
function startOrderRoulette() {
    document.getElementById('menu-screen').classList.add('hidden');
    
    let speed = 50;
    let idx = 0;
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.remove('hidden');
    
    document.getElementById('popup-title').innerText = "順番決めルーレット";
    
    const timer = setInterval(() => {
        document.getElementById('popup-body').innerText = `▶ ${STATE.players[idx % STATE.players.length].name} ◀`;
        idx++;
    }, speed);

    document.getElementById('popup-btn').innerText = "ストップ！";
    document.getElementById('popup-btn').onclick = () => {
        clearInterval(timer);
        // 画面シェイク演出
        document.getElementById('app-container').classList.add('shake');
        setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 500);

        // シャッフル
        STATE.players.sort(() => Math.random() - 0.5);
        
        document.getElementById('popup-title').innerText = "順番決定！";
        document.getElementById('popup-body').innerHTML = STATE.players.map((p, i) => `${i + 1}番目: ${p.name}`).join('<br>');
        document.getElementById('popup-btn').innerText = "全員確認してゲーム開始";
        document.getElementById('popup-btn').onclick = () => {
            overlay.classList.add('hidden');
            startGame();
        };
    };
}

/* ==========================================================================
   4. ゲームメインループ ＆ ターン制御 (Game Loop & Turn Controller)
   ========================================================================== */

function startGame() {
    STATE.mode = 'GAME';
    buildJengaTower();
    createPlayerHands();
    updateGUI();
    startTurn();
}

function startTurn() {
    STATE.phase = 'SELECT';
    STATE.timer = 20;
    document.getElementById('huge-count').classList.add('hidden');
    
    // アイテム効果の初期化チェック等
    updateGUI();

    if (STATE.timerInterval) clearInterval(STATE.timerInterval);
    STATE.timerInterval = setInterval(() => {
        STATE.timer--;
        document.getElementById('gui-timer').innerText = STATE.timer;
        
        if (STATE.timer <= 5 && STATE.timer > 0) {
            const hc = document.getElementById('huge-count');
            hc.classList.remove('hidden');
            hc.innerText = STATE.timer;
        }

        if (STATE.timer <= 0) {
            clearInterval(STATE.timerInterval);
            nextTurn(); // タイムアウトで自動終了
        }
    }, 1000);
}

function nextTurn() {
    clearInterval(STATE.timerInterval);
    document.getElementById('spit-overlay').classList.add('hidden'); // くしゃみリセット
    STATE.turnIndex = (STATE.turnIndex + 1) % STATE.players.length;
    startTurn();
}

function updateGUI() {
    // プレイヤーリスト
    const container = document.getElementById('gui-player-list');
    container.innerHTML = '';
    STATE.players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === STATE.turnIndex ? 'active' : ''}`;
        card.innerHTML = `
            <div><b>${p.name}</b></div>
            <div>獲:${p.score}本</div>
            <div class="hp-bar" style="width:${(p.hp/p.maxHp)*100}%"></div>
        `;
        container.appendChild(card);
    });

    // アイテム数
    const curP = STATE.players[STATE.turnIndex];
    ['ojama', 'sneeze', 'renzoku', 'pass', 'ganriki', 'rob'].forEach(item => {
        const cnt = curP.items[item] || 0;
        document.getElementById(`count-${item}`).innerText = cnt;
        const btn = document.getElementById(`item-${item}`);
        if (cnt > 0) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

/* ==========================================================================
   5. 操作ボタン機能（全体、面、近接、段数）
   ========================================================================== */

function setViewMode(mode) {
    if (mode === 'all') {
        camera.position.set(0, 12, 25);
        camera.lookAt(0, 6, 0);
    } else if (mode === 'zoom') {
        // 5段分アップ
        const targetY = (STATE.currentTier - 1) * 3 + 2;
        camera.position.set(0, targetY, 8);
        camera.lookAt(0, targetY, 0);
    }
}

function cycleFace() {
    STATE.currentFace = (STATE.currentFace % 4) + 1;
    document.getElementById('face-num').innerText = STATE.currentFace;
    const angle = (STATE.currentFace - 1) * (Math.PI / 2);
    const r = 25;
    camera.position.set(Math.sin(angle) * r, 12, Math.cos(angle) * r);
    camera.lookAt(0, 6, 0);
}

function cycleTier() {
    STATE.currentTier = (STATE.currentTier % 4) + 1;
    document.getElementById('tier-num').innerText = STATE.currentTier;
    setViewMode('zoom');
}

/* ==========================================================================
   6. 抜き取り・角度選択・パワー＆ガードバトル
   ========================================================================== */

// 簡易タップ判定（Raycastによるブロック選択）
window.addEventListener('pointerdown', (e) => {
    if (STATE.mode !== 'GAME' || STATE.phase !== 'SELECT') return;

    const rect = renderer.domElement.getBoundingClientRect();
    if (e.clientY > rect.bottom) return; // GUIエリア無視

    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

    if (intersects.length > 0) {
        const targetMesh = intersects[0].object;
        STATE.selectedBlock = blocks.find(b => b.mesh === targetMesh);
        if (STATE.selectedBlock) {
            startAngleSelection();
        }
    }
});

function startAngleSelection() {
    STATE.phase = 'ANGLE_H';
    // 横・縦の角度決定ダイアログ
    showPopup("角度選択 (1/2)", "横のストップ位置を決めます。中心の赤い〇を狙ってください！", "決定", () => {
        STATE.phase = 'ANGLE_V';
        showPopup("角度選択 (2/2)", "縦のストップ位置を決めます。中心の赤い〇を狙ってください！", "セットオン (SET ON)", () => {
            triggerSetOnAnimation();
        });
    });
}

function triggerSetOnAnimation() {
    // 全体回転演出
    let rot = 0;
    const timer = setInterval(() => {
        rot += 0.2;
        camera.position.x = Math.sin(rot) * 20;
        camera.position.z = Math.cos(rot) * 20;
        camera.lookAt(0, 6, 0);
    }, 30);

    setTimeout(() => {
        clearInterval(timer);
        openPowerGauge('POWER');
    }, 1500);
}

function openPowerGauge(type) {
    const overlay = document.getElementById('power-gauge-overlay');
    overlay.classList.remove('hidden');
    
    STATE.gaugeRunning = true;
    STATE.gaugePos = 0;
    STATE.gaugeSpeed = Math.random() * 3 + 2; // スピードランダム

    const curP = STATE.players[STATE.turnIndex];
    if (type === 'POWER') {
        document.getElementById('gauge-owner-title').innerText = `${curP.name} の攻撃パワー！`;
    } else {
        const targetP = STATE.players[(STATE.turnIndex + 1) % STATE.players.length];
        document.getElementById('gauge-owner-title').innerText = `${targetP.name} のガードポイント！`;
    }
}

function stopGauge() {
    if (!STATE.gaugeRunning) return;
    STATE.gaugeRunning = false;
    
    const val = Math.floor(STATE.gaugePos);
    document.getElementById('power-gauge-overlay').classList.add('hidden');

    if (STATE.phase === 'ANGLE_V' || STATE.phase === 'POWER') {
        STATE.powerScore = val;
        // 相手のガードへ
        STATE.phase = 'GUARD';
        showPopup("パワー確定！", `<span class="power-impact-text">${val} POWER</span>`, "相手ガード判定へ", () => {
            openPowerGauge('GUARD');
        });
    } else if (STATE.phase === 'GUARD') {
        STATE.guardScore = val;
        resolveBattleResult();
    }
}

function resolveBattleResult() {
    const diff = STATE.powerScore - STATE.guardScore;
    const turnP = STATE.players[STATE.turnIndex];
    const targetP = STATE.players[(STATE.turnIndex + 1) % STATE.players.length];

    let msg = `<div class="power-impact-text">${STATE.powerScore} POWER</div>`;
    msg += `<div class="guard-impact-text">VS ${STATE.guardScore} GUARD</div><br>`;

    if (diff <= 0) {
        msg += `<b style="color:#00ff00;">ガード成功！ダメージなし</b>`;
    } else {
        const damage = Math.ceil(diff / 10);
        targetP.hp = Math.max(0, targetP.hp - damage);
        msg += `<b style="color:#ff3333;">${targetP.name} に ${damage} のダメージ！</b>`;
        
        // 被弾シェイク
        document.getElementById('app-container').classList.add('shake');
        setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);
    }

    // クリティカル・抜き取り物理演出
    if (STATE.powerScore === 100) {
        msg += `<br><b style="color:#ffff00;">★ CRITICAL BREAK ★</b>`;
    }

    // 物理的に力（Impulse）を加える
    if (STATE.selectedBlock) {
        const pushForce = (STATE.powerScore / 50) * 5;
        STATE.selectedBlock.body.applyImpulse(
            new CANNON.Vec3(0, 0, -pushForce),
            STATE.selectedBlock.body.position
        );
        turnP.score++;
        rollItemReward(turnP);
    }

    showPopup("結果発表", msg, "ターン終了", () => {
        if (targetP.hp <= 0) {
            alert(`${targetP.name} 脱落！`);
        }
        nextTurn();
    });
}

/* ==========================================================================
   7. アイテムシステム＆効果発動
   ========================================================================== */

function rollItemReward(player) {
    if (Math.random() < 0.5) return; // 50%で獲得

    const itemList = ['ojama', 'sneeze', 'renzoku', 'pass', 'ganriki', 'rob'];
    const reward = itemList[Math.floor(Math.random() * itemList.length)];
    
    if ((player.items[reward] || 0) < 5) {
        player.items[reward] = (player.items[reward] || 0) + 1;
        setTimeout(() => {
            showPopup("アイテムGET！", `ルーレットの結果...<br><b>【${reward.toUpperCase()}】</b> を獲得！`, "OK");
        }, 1000);
    }
}

function useItem(type) {
    const p = STATE.players[STATE.turnIndex];
    if (!p.items[type] || p.items[type] <= 0) return;

    p.items[type]--;
    updateGUI();

    if (type === 'pass') {
        showPopup("アイテム発動", "【パス】を使用しました。ターンをスキップします。", "OK", () => nextTurn());
    } else if (type === 'sneeze') {
        document.getElementById('spit-overlay').classList.remove('hidden');
        showPopup("アイテム発動", "【くしゃみ】発動！画面が汚れた！", "OK");
    } else if (type === 'ganriki') {
        // 最も負荷がかかっていないブロック（Y座標が高く動きがないもの等）を光らせる
        const target = blocks[blocks.length - 1];
        if (target) {
            target.mesh.material.forEach(m => m.color.setHex(0x00ffff));
        }
        showPopup("アイテム発動", "【眼力】発動！安全なブロックが青く輝いた！", "OK");
    } else if (type === 'rob') {
        const targetP = STATE.players[(STATE.turnIndex + 1) % STATE.players.length];
        targetP.hp = Math.max(0, targetP.hp - 10);
        p.hp += 10;
        showPopup("アイテム発動", `【強奪】発動！ ${targetP.name} から体力を奪い取った！`, "OK");
    } else {
        showPopup("アイテム発動", `【${type.toUpperCase()}】を発動しました！`, "OK");
    }
}

/* ==========================================================================
   8. 倒壊判定・勝敗・リスタート
   ========================================================================== */

function checkCollapse() {
    // 高さが崩れたブロックがあるかチェック
    for (let b of blocks) {
        if (b.body.position.y < -0.2 || Math.abs(b.body.position.x) > 6 || Math.abs(b.body.position.z) > 6) {
            triggerGameOver();
            break;
        }
    }
}

function triggerGameOver() {
    STATE.mode = 'OVER';
    clearInterval(STATE.timerInterval);

    // スコア計算 (獲得数 + 残りHP)
    const rankings = [...STATE.players].sort((a, b) => (b.score + b.hp) - (a.score + a.hp));
    const winner = rankings[0];

    let html = `<h2 style="color:#ffcc00;">👑 ${winner.name} WIN! 👑</h2><br>`;
    html += rankings.map((p, i) => `${i + 1}位: 👑 ${p.name} (獲得:${p.score} / HP:${p.hp})`).join('<br>');

    showPopup("倒壊！ゲーム終了", html, "リトライ / 終了", () => {
        location.reload();
    });
}

// 汎用ポップアップヘルパー
function showPopup(title, body, btnText = "OK", callback = null) {
    const overlay = document.getElementById('popup-overlay');
    document.getElementById('popup-title').innerText = title;
    document.getElementById('popup-body').innerHTML = body;
    const btn = document.getElementById('popup-btn');
    btn.innerText = btnText;
    btn.onclick = () => {
        overlay.classList.add('hidden');
        if (callback) callback();
    };
    overlay.classList.remove('hidden');
}

function closePopup() {
    document.getElementById('popup-overlay').classList.add('hidden');
}
</script>
