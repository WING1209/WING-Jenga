<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOSHIO JENGGA - Balance Adjusted Edition</title>
    <!-- Three.js & Cannon.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #1e90ff, #87ceeb);
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }

        /* タイトル画面 */
        #title-screen {
            background: linear-gradient(to bottom, #005c8a, #1e90ff);
            color: white;
            text-align: center;
        }
        .game-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .blink-start {
            font-size: 1.5rem;
            padding: 15px 40px;
            background: #ffcc00;
            color: #333;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,204,0,0.4);
            animation: blink 1s infinite alternate;
            cursor: pointer;
        }
        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* メニュー画面 */
        #menu-screen {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        .menu-btn {
            width: 240px;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        /* ゲーム画面 */
        #game-screen {
            display: block;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 左右回転矢印 */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        #arrow-left { left: 15px; }
        #arrow-right { right: 15px; }

        /* 左側GUIパネル */
        #gui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 5;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 160px;
        }
        .gui-row {
            margin-bottom: 8px;
        }
        .gui-btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .gui-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #punch-btn {
            background: #e91e63;
            display: none;
        }
        #punch-btn.active {
            display: block;
        }
        #finish-extract-btn {
            background: #4caf50;
            display: none;
        }
        #finish-extract-btn.active {
            display: block;
        }

        /* ツンツンパワー選択パネル（下部） */
        #tsuntsun-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            display: none;
            flex-direction: row;
            gap: 8px;
            z-index: 15;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #tsuntsun-panel.active {
            display: flex;
        }
        .tsun-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .tsun-btn:active {
            transform: scale(0.92);
            background: #f57c00;
        }

        /* 確認ポップアップ */
        #confirm-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .popup-box p {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .popup-btns {
            display: flex;
            justify-content: space-around;
        }
        .pop-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        #pop-ok { background: #4caf50; color: white; }
        #pop-no { background: #f44336; color: white; }

        /* 威力ゲージオーバーレイ */
        #gauge-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            color: white;
        }
        .gauge-bar-container {
            width: 80%;
            max-width: 350px;
            height: 40px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }
        .gauge-labels {
            width: 80%;
            max-width: 350px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .gauge-cursor {
            width: 30px;
            height: 34px;
            background: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .gauge-stop-btn {
            padding: 15px 40px;
            background: #ff9800;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* メッセージバナー */
        #message-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            z-index: 30;
            pointer-events: none;
            transition: 0.3s;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen">
        <div class="game-title">YOSHIO JENGGA</div>
        <button class="blink-start" id="start-trigger">スタート</button>
    </div>

    <!-- 2. メニュー画面 -->
    <div id="menu-screen" class="screen hidden">
        <div class="game-title" style="font-size: 2rem; margin-bottom: 30px;">MENU</div>
        <button class="menu-btn" id="btn-solo">ひとりで遊ぶ</button>
        <button class="menu-btn" id="btn-host">ホスト (準備中)</button>
        <button class="menu-btn" id="btn-guest">ゲスト (準備中)</button>
        <button class="menu-btn" id="btn-exit" style="background:#ffdddd; color:#d9534f;">終了</button>
    </div>

    <!-- 3. ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div id="canvas-container"></div>

        <div class="arrow-btn" id="arrow-left">◀</div>
        <div class="arrow-btn" id="arrow-right">▶</div>

        <div id="gui-panel">
            <div class="gui-row">P: <span id="player-name">YOSHIO</span></div>
            <div class="gui-row">獲得: <span id="score-count">0</span> 本</div>
            <div class="gui-row">パス残: <span id="pass-count">2</span> 回</div>
            <button class="gui-btn" id="pass-btn">パスする</button>
            <button class="gui-btn" id="zoom-btn">拡大表示</button>
            <button class="gui-btn" id="punch-btn">打ち抜く</button>
            <button class="gui-btn" id="finish-extract-btn">抜き終了</button>
        </div>

        <!-- ツンツンパワー選択パネル（下部） -->
        <div id="tsuntsun-panel">
            <span style="color:white; font-weight:bold; align-self:center; font-size:0.85rem;">ツン度:</span>
            <button class="tsun-btn" onclick="doTsunTsun(10)">10</button>
            <button class="tsun-btn" onclick="doTsunTsun(20)">20</button>
            <button class="tsun-btn" onclick="doTsunTsun(30)">30</button>
            <button class="tsun-btn" onclick="doTsunTsun(40)">40</button>
            <button class="tsun-btn" onclick="doTsunTsun(50)">50</button>
        </div>

        <div id="message-banner"></div>
    </div>

    <!-- 確認ポップアップ -->
    <div id="confirm-popup" class="hidden">
        <div class="popup-box">
            <p>この棒でよいですか？</p>
            <div class="popup-btns">
                <button class="pop-btn" id="pop-no">NO</button>
                <button class="pop-btn" id="pop-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- 威力ゲージオーバーレイ -->
    <div id="gauge-overlay">
        <h2 style="margin:0; text-shadow:0 2px 5px rgba(0,0,0,0.5);">威力ゲージ (MAXで強制獲得!)</h2>
        <div class="gauge-bar-container" id="gauge-container">
            <div class="gauge-cursor" id="gauge-cursor"></div>
        </div>
        <div class="gauge-labels">
            <span>0</span>
            <span>100 (MAX)</span>
        </div>
        <button class="gauge-stop-btn" id="gauge-stop-btn">ストップ！</button>
    </div>

    <script>
        let gameState = 'view'; // 'view', 'action', 'check', 'place', 'gameover'
        let isZoomed = false;
        let selectedBlock = null;
        let extractedBlockData = null;
        let passRemaining = 2;
        let score = 0;
        let timerSeconds = 0;
        let timerInterval = null;

        // ドラッグ用
        let isDraggingBlock = false;
        let previousPointerX = 0;

        // パーティクル・演出用
        let fireworks = [];
        let convergingParticles = [];
        let isConverging = false;
        let pendingPunchPower = 0;
        let shakeDuration = 0;
        let shakeIntensity = 0;
        let isTsunLocked = false;

        const titleScreen = document.getElementById('title-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const confirmPopup = document.getElementById('confirm-popup');
        const gaugeOverlay = document.getElementById('gauge-overlay');
        const messageBanner = document.getElementById('message-banner');

        document.getElementById('start-trigger').addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        document.getElementById('btn-solo').addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            initGame3D();
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            window.close();
            alert('ブラウザのタブを閉じてください。');
        });

        let scene, camera, renderer, world;
        let blocks = [];
        let towerGroup;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        let cameraAngle = 0;
        let lookAtY = 6;
        let cameraHeightOffset = 9.0;
        let isViewDragging = false;
        let previousTouchY = 0;

        function initGame3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // 青空背景
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.solver.iterations = 30;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 台座
            const baseGeo = new THREE.BoxGeometry(6, 1, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.5;
            scene.add(baseMesh);

            const baseShape = new CANNON.Box(new CANNON.Vec3(3, 0.5, 3));
            const baseBody = new CANNON.Body({ mass: 0 });
            baseBody.addShape(baseShape);
            baseBody.position.set(0, -0.5, 0);
            world.addBody(baseBody);

            towerGroup = new THREE.Group();
            scene.add(towerGroup);

            const blockWidth = 1.2;
            const blockHeight = 0.6;
            const blockDepth = 3.6;
            const blockShape = new CANNON.Box(new CANNON.Vec3(blockWidth/2, blockHeight/2, blockDepth/2));

            for (let i = 0; i < 20; i++) {
                let y = blockHeight/2 + i * blockHeight;
                let isEven = (i % 2 === 0);

                for (let j = 0; j < 3; j++) {
                    let x = 0, z = 0, rotY = 0;
                    if (isEven) {
                        x = (j - 1) * 1.25;
                        rotY = 0;
                    } else {
                        z = (j - 1) * 1.25;
                        rotY = Math.PI / 2;
                    }

                    const geo = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.4 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData = { id: blocks.length, originalColor: 0xDEB887, floor: i };
                    mesh.position.set(x, y, z);
                    towerGroup.add(mesh);

                    // 通常時は完全固定 (mass = 0)
                    const body = new CANNON.Body({ mass: 0 });
                    body.addShape(blockShape);
                    body.position.set(x, y, z);
                    body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
                    world.addBody(body);

                    blocks.push({ mesh, body, isDynamic: false });
                }
            }

            gameState = 'view';
            initEvents();
            animate();
        }

        function updateCameraPosition() {
            let targetRadius = isZoomed ? 10 : 20;
            if (isZoomed) {
                cameraHeightOffset = 4.2;
            } else {
                cameraHeightOffset = 9.0;
            }

            const rad = cameraAngle * Math.PI / 180;
            camera.position.x = Math.sin(rad) * targetRadius;
            camera.position.z = Math.cos(rad) * targetRadius;
            camera.position.y = lookAtY + cameraHeightOffset;
            camera.lookAt(0, lookAtY, 0);
        }

        function initEvents() {
            document.getElementById('arrow-left').addEventListener('click', () => {
                cameraAngle -= 45;
                updateCameraPosition();
            });
            document.getElementById('arrow-right').addEventListener('click', () => {
                cameraAngle += 45;
                updateCameraPosition();
            });

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    if (gameState === 'view') {
                        isViewDragging = true;
                        previousTouchY = e.touches[0].clientY;
                    } else if (gameState === 'action') {
                        isDraggingBlock = true;
                        previousPointerX = e.touches[0].clientX;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (isViewDragging && gameState === 'view') {
                    const currentY = e.touches[0].clientY;
                    const deltaY = currentY - previousTouchY;
                    previousTouchY = currentY;
                    lookAtY -= deltaY * 0.05;
                    lookAtY = Math.max(3, Math.min(15, lookAtY));
                    updateCameraPosition();
                } else if (isDraggingBlock && gameState === 'action' && selectedBlock) {
                    const currentX = e.touches[0].clientX;
                    const deltaX = currentX - previousPointerX;
                    previousPointerX = currentX;
                    handleBlockDragAction(deltaX);
                }
            });

            window.addEventListener('touchend', () => {
                isViewDragging = false;
                isDraggingBlock = false;
            });

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#gui-panel') || e.target.closest('#confirm-popup') || e.target.closest('#gauge-overlay') || e.target.closest('.arrow-btn') || e.target.closest('#tsuntsun-panel')) return;
                if (gameState === 'action') {
                    isDraggingBlock = true;
                    previousPointerX = e.clientX;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingBlock && gameState === 'action' && selectedBlock) {
                    const deltaX = e.clientX - previousPointerX;
                    previousPointerX = e.clientX;
                    handleBlockDragAction(deltaX);
                }
            });

            window.addEventListener('mouseup', () => {
                isDraggingBlock = false;
            });

            window.addEventListener('click', (e) => {
                if (e.target.closest('#gui-panel') || e.target.closest('#confirm-popup') || e.target.closest('#gauge-overlay') || e.target.closest('.arrow-btn') || e.target.closest('#tsuntsun-panel')) return;

                if (gameState === 'view') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

                    if (intersects.length > 0) {
                        selectBlockForConfirmation(intersects[0].object);
                    }
                } else if (gameState === 'place') {
                    placeExtractedBlock();
                }
            });

            document.getElementById('zoom-btn').addEventListener('click', () => {
                isZoomed = !isZoomed;
                document.getElementById('zoom-btn').textContent = isZoomed ? '縮小表示' : '拡大表示';
                updateCameraPosition();
            });

            document.getElementById('pass-btn').addEventListener('click', () => {
                if (passRemaining > 0 && gameState === 'view') {
                    passRemaining--;
                    document.getElementById('pass-count').textContent = passRemaining;
                    showBanner('パスしました！次のプレイヤーへ');
                } else {
                    alert('パスできない状態か、回数が残っていません！');
                }
            });

            document.getElementById('pop-no').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                if (selectedBlock) {
                    selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
                    selectedBlock = null;
                }
            });

            document.getElementById('pop-ok').addEventListener('click', () => {
                confirmPopup.classList.add('hidden');
                startActionPhase();
            });

            document.getElementById('punch-btn').addEventListener('click', () => {
                if (gameState === 'action') openGauge();
            });

            document.getElementById('gauge-stop-btn').addEventListener('click', () => {
                stopGauge();
            });

            document.getElementById('finish-extract-btn').addEventListener('click', () => {
                if (gameState === 'action') {
                    startSuccessCheckTimer();
                }
            });
        }

        // --- ツンツンアクション（重みを軽くしてしっかり反応するように調整） ---
        function doTsunTsun(power) {
            if (gameState !== 'action' || isTsunLocked || !selectedBlock) return;

            const targetObj = blocks.find(b => b.mesh === selectedBlock);
            if (!targetObj) return;

            isTsunLocked = true;
            extractedBlockData = targetObj;

            // 力を強めに設定してしっかり動くようにする
            const localVector = new CANNON.Vec3(0, 0, power * 0.4);
            const worldVector = targetObj.body.quaternion.vmult(localVector);
            
            targetObj.body.applyImpulse(worldVector, targetObj.body.position);
            showBanner(`ツン！ (威力: ${power})`);

            let subTimer = 0.5;
            let checkInterval = setInterval(() => {
                subTimer -= 0.2;
                if (checkTowerCollapse()) {
                    clearInterval(checkInterval);
                    return;
                }

                if (subTimer <= 0) {
                    clearInterval(checkInterval);
                    if (gameState === 'action') {
                        isTsunLocked = false;
                        showBanner('アクションを続けてください');
                    }
                }
            }, 200);
        }

        function handleBlockDragAction(deltaX) {
            const targetObj = blocks.find(b => b.mesh === selectedBlock);
            if (!targetObj) return;

            extractedBlockData = targetObj;
            const rad = cameraAngle * Math.PI / 180;
            const moveX = deltaX * Math.cos(rad) * 0.05;
            const moveZ = -deltaX * Math.sin(rad) * 0.05;

            targetObj.body.position.x += moveX;
            targetObj.body.position.z += moveZ;

            checkTowerCollapse();
            showBanner('ドラッグで引き抜き中');
        }

        function selectBlockForConfirmation(mesh) {
            if (selectedBlock) {
                selectedBlock.material.color.setHex(selectedBlock.userData.originalColor);
            }
            selectedBlock = mesh;
            selectedBlock.material.color.setHex(0xff0000);
            confirmPopup.classList.remove('hidden');
        }

        function startActionPhase() {
            gameState = 'action';
            isZoomed = true;
            document.getElementById('zoom-btn').textContent = '縮小表示';
            lookAtY = selectedBlock.position.y;
            updateCameraPosition();

            // 選択された棒の重みを軽め（mass = 0.6）にして動かしやすくする
            blocks.forEach(b => {
                if (b.mesh === selectedBlock) {
                    b.body.mass = 0.6;
                } else {
                    b.body.mass = 0; // 他は完全固定
                }
                b.body.updateMassProperties();
                b.isDynamic = true;
            });

            document.getElementById('punch-btn').classList.add('active');
            document.getElementById('finish-extract-btn').classList.add('active');
            document.getElementById('tsuntsun-panel').classList.add('active');
            
            showBanner('【アクション】ツンツン・打ち抜く・ドラッグ！');
        }

        // --- パワーゲージ（左0 〜 右100、スピードランダム変動） ---
        let isAnimatingGauge = false;
        let gaugePos = 0;
        let gaugeSpeed = 2;

        function openGauge() {
            isAnimatingGauge = true;
            gaugePos = 0;
            gaugeSpeed = 1.5 + Math.random() * 2.5; // 初期スピードをランダムに設定
            gaugeOverlay.style.display = 'flex';
            requestAnimationFrame(updateGaugeAnimation);
        }

        function updateGaugeAnimation() {
            if (!isAnimatingGauge) return;

            gaugePos += gaugeSpeed;

            // 端に達したらスピードをランダムに変えて折り返す
            if (gaugePos >= 100) {
                gaugePos = 100;
                gaugeSpeed = -(1.5 + Math.random() * 3.5);
            } else if (gaugePos <= 0) {
                gaugePos = 0;
                gaugeSpeed = 1.5 + Math.random() * 3.5;
            }

            document.getElementById('gauge-cursor').style.left = gaugePos + '%';
            requestAnimationFrame(updateGaugeAnimation);
        }

        function stopGauge() {
            isAnimatingGauge = false;
            gaugeOverlay.style.display = 'none';

            // 100（MAX）だった場合はどのような状況下でも強制獲得！
            if (gaugePos >= 98) {
                showBanner('🔥 MAX!! どんな状況下でも強制獲得！ 🔥');
                shakeDuration = 0.8;
                shakeIntensity = 0.6;
                createFireworks();
                setTimeout(() => {
                    successTurn();
                }, 1500);
                return;
            }

            pendingPunchPower = Math.floor(gaugePos * 0.4 + 5);
            shakeDuration = 0.5;
            shakeIntensity = 0.4;

            showBanner(`💥 威力: ${Math.floor(gaugePos)} (パワー発動) 💥`);
            startLightConvergenceEffect();
        }

        function startLightConvergenceEffect() {
            isConverging = true;
            convergingParticles = [];

            const target = blocks.find(b => b.mesh === selectedBlock);
            if (!target) return;

            const centerPos = target.body.position;
            const count = 40;

            for (let i = 0; i < count; i++) {
                const geo = new THREE.SphereGeometry(0.08, 6, 6);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const pMesh = new THREE.Mesh(geo, mat);

                const radius = 3.0 + Math.random() * 2.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                const startPos = new THREE.Vector3(
                    centerPos.x + radius * Math.sin(phi) * Math.cos(theta),
                    centerPos.y + radius * Math.cos(phi),
                    centerPos.z + radius * Math.sin(phi) * Math.sin(theta)
                );

                pMesh.position.copy(startPos);
                scene.add(pMesh);

                convergingParticles.push({
                    mesh: pMesh,
                    start: startPos,
                    target: centerPos,
                    progress: 0,
                    speed: 0.04 + Math.random() * 0.05
                });
            }
        }

        function executePunch() {
            const target = blocks.find(b => b.mesh === selectedBlock);
            if (target) {
                target.body.velocity.set(0, 2, pendingPunchPower * 0.5);
                target.body.angularVelocity.set(4, 4, 0);
                extractedBlockData = target;
            }
            startSuccessCheckTimer();
        }

        function checkTowerCollapse() {
            let isCollapsed = false;
            blocks.forEach(b => {
                if (b.body.position.y < -0.2 || Math.abs(b.body.position.x) > 4.5 || Math.abs(b.body.position.z) > 4.5) {
                    isCollapsed = true;
                }
            });

            if (isCollapsed && gameState !== 'gameover' && gameState !== 'view') {
                gameState = 'gameover';
                showBanner('GAME OVER: タワーが倒れました！');
                document.getElementById('punch-btn').classList.remove('active');
                document.getElementById('finish-extract-btn').classList.remove('active');
                document.getElementById('tsuntsun-panel').classList.remove('active');
                return true;
            }
            return false;
        }

        function startSuccessCheckTimer() {
            gameState = 'check';
            document.getElementById('punch-btn').classList.remove('active');
            document.getElementById('finish-extract-btn').classList.remove('active');
            document.getElementById('tsuntsun-panel').classList.remove('active');
            timerSeconds = 3;
            showBanner('バランス確認中... (3秒)');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (checkTowerCollapse()) {
                    clearInterval(timerInterval);
                    return;
                }

                if (timerSeconds > 0) {
                    showBanner(`バランス確認中... (${timerSeconds}秒)`);
                } else {
                    clearInterval(timerInterval);
                    successTurn();
                }
            }, 1000);
        }

        function successTurn() {
            freezeTower();
            score++;
            document.getElementById('score-count').textContent = score;
            
            showBanner('成功！！ 🎉 次のターンへ');
            createFireworks();

            setTimeout(() => {
                startPlacementPhase();
            }, 2500);
        }

        function freezeTower() {
            blocks.forEach(b => {
                b.body.mass = 0;
                b.body.velocity.set(0,0,0);
                b.body.angularVelocity.set(0,0,0);
                b.body.updateMassProperties();
                b.isDynamic = false;
            });
        }

        function createFireworks() {
            const particleCount = 60;
            const colors = [0xff4081, 0xffeb3b, 0x00e676, 0x00bcd4, 0xff9800];
            
            for (let i = 0; i < particleCount; i++) {
                const geo = new THREE.SphereGeometry(0.15, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const particle = new THREE.Mesh(geo, mat);
                
                particle.position.set(0, lookAtY, 0);
                scene.add(particle);

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.08 + Math.random() * 0.12;

                fireworks.push({
                    mesh: particle,
                    vx: Math.sin(phi) * Math.cos(theta) * speed,
                    vy: Math.cos(phi) * speed,
                    vz: Math.sin(phi) * Math.sin(theta) * speed,
                    life: 60
                });
            }
        }

        function startPlacementPhase() {
            gameState = 'place';
            lookAtY = 15;
            cameraAngle = 0;
            isZoomed = false;
            updateCameraPosition();

            if (selectedBlock) {
                const target = blocks.find(b => b.mesh === selectedBlock);
                if (target) {
                    extractedBlockData = target;
                    target.mesh.material.transparent = true;
                    target.mesh.material.opacity = 0.6;
                }
            }
            showBanner('上部をタップして棒を配置してください');
        }

        function placeExtractedBlock() {
            if (!extractedBlockData) return;
            showBanner('配置完了！安定確認中...(3秒)');
            
            let topY = 20 * 0.6 + 0.6;
            extractedBlockData.body.position.set(0, topY, 0);
            extractedBlockData.mesh.material.transparent = false;
            extractedBlockData.mesh.material.opacity = 1.0;
            extractedBlockData.mesh.material.color.setHex(extractedBlockData.mesh.userData.originalColor);

            blocks.forEach(b => {
                b.body.mass = 0;
                b.body.updateMassProperties();
                b.isDynamic = false;
            });

            extractedBlockData = null;
            
            gameState = 'check';
            timerSeconds = 3;
            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds > 0) {
                    showBanner(`設置安定確認中... (${timerSeconds}秒)`);
                } else {
                    clearInterval(timerInterval);
                    showBanner('ターンクリア！次のプレイヤーへ');
                    selectedBlock = null;
                    setTimeout(() => {
                        gameState = 'view';
                        lookAtY = 6;
                        updateCameraPosition();
                        showBanner('');
                    }, 2000);
                }
            }, 1000);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (world) {
                if (gameState === 'action' || gameState === 'check') {
                    world.step(1 / 60, delta, 3);
                    checkTowerCollapse();
                }
                for (let i = 0; i < blocks.length; i++) {
                    blocks[i].mesh.position.copy(blocks[i].body.position);
                    blocks[i].mesh.quaternion.copy(blocks[i].body.quaternion);
                }
            }

            if (shakeDuration > 0) {
                shakeDuration -= delta;
                camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                camera.position.y += (Math.random() - 0.5) * shakeIntensity;
            }

            if (isConverging) {
                let allDone = true;
                for (let i = 0; i < convergingParticles.length; i++) {
                    let p = convergingParticles[i];
                    p.progress += p.speed;
                    p.mesh.position.lerpVectors(p.start, p.target, p.progress);
                    if (p.progress < 1.0) {
                        allDone = false;
                    }
                }
                if (allDone) {
                    isConverging = false;
                    convergingParticles.forEach(p => scene.remove(p.mesh));
                    convergingParticles = [];
                    executePunch();
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.mesh.position.x += fw.vx;
                fw.mesh.position.y += fw.vy;
                fw.mesh.position.z += fw.vz;
                fw.life--;

                if (fw.life <= 0) {
                    scene.remove(fw.mesh);
                    fireworks.splice(i, 1);
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function showBanner(text) {
            messageBanner.textContent = text;
            messageBanner.style.opacity = '1';
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
